name: Command Table Android integration build
on:
  push:
    branches: [main, command-table-native-ui-only]
    paths:
      - 'android/**'
      - 'forge-integration/**'
      - 'tests/**'
      - '.github/workflows/command-table-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'forge-integration/**'
      - 'tests/**'
      - '.github/workflows/command-table-android.yml'
  workflow_dispatch:
concurrency:
  group: command-table-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  embedded-forge-android:
    name: Build Command Table APK with embedded Forge Android runtime (integration verification)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify recovery integration contract before downloading Forge
        run: |
          mkdir -p recovery-logs
          node tests/verify-forge-integration.cjs 2>&1 | tee recovery-logs/preflight.txt
          node tests/verify-commandtable-recovery.cjs android/app/src/main/assets/index.html 2>&1 | tee -a recovery-logs/preflight.txt
      - name: Fetch pinned Forge engine and Android source
        run: |
          git clone --filter=blob:none https://github.com/Card-Forge/forge.git /tmp/forge
          cd /tmp/forge
          git checkout 5a60e6875132b5b90a080aefe71d4cca4b77917f
      - name: Embed Command Table into Forge Android
        run: |
          {
            python3 forge-integration/tools/patch_forge_android.py /tmp/forge "$PWD"
            python3 forge-integration/tools/patch_frontend.py android/app/src/main/assets/index.html /tmp/forge/forge-gui-android/assets/command-table.html
            test -s /tmp/forge/forge-gui-android/assets/command-table.html
          } 2>&1 | tee recovery-logs/forge-patch.txt
      - name: Bundle complete Forge rules and card resources inside the APK
        run: |
          python3 forge-integration/tools/pack_forge_resources.py /tmp/forge /tmp/forge/forge-gui-android/assets/command-table-forge-resources.zip
          python3 - <<'PY'
          import zipfile, pathlib
          p=pathlib.Path('/tmp/forge/forge-gui-android/assets/command-table-forge-resources.zip')
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert 'res/cardsfolder/cardsfolder.zip' in names, 'Missing offline Forge cards library'
              assert any(n.startswith('res/editions/') for n in names), 'Missing editions'
              assert any(n.startswith('res/skins/') for n in names), 'Missing UI skin assets'
          print('Bundled source verified',p.stat().st_size)
          PY
      - name: Regression test recovered commander importing and embedded UI
        run: |
          node tests/verify-commandtable-recovery.cjs android/app/src/main/assets/index.html
          node tests/verify-commandtable-recovery.cjs /tmp/forge/forge-gui-android/assets/command-table.html
      - name: Check Command Table JavaScript and native gameplay handoff
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          doc=pathlib.Path('/tmp/forge/forge-gui-android/assets/command-table.html').read_text()
          checks=['ctHydrateForgeState','game.prompt','ct-forge-priority-buttons','window.ctForgeCards',
                  'if(app.nativeMatch && app.view','ctNativeActionValue(act,v)']
          for check in checks:
              assert check in doc, 'Native integration missing: '+check
          assert 'command-table-forge-choice' not in doc, 'Duplicate legacy priority panel reintroduced'
          assert doc.count("decision.id='ct-forge-priority-buttons'")==1, 'Expected only one Forge priority dock'
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',doc,re.S|re.I)
          assert blocks, 'No JavaScript in Android UI'
          for i,block in enumerate(blocks):
              target=pathlib.Path(f'/tmp/commandtable-{i}.js')
              target.write_text(block)
              subprocess.run(['node','--check',str(target)],check=True)
          print(f'Checked {len(blocks)} JavaScript modules and native integration markers')
          PY
      - name: Execute card catalog JavaScript boot and reject initialization errors
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('/tmp/forge/forge-gui-android/assets/command-table.html','utf8');
          const first=html.split('<script>')[1]?.split('</script>')[0];
          if(!first)throw new Error('Bundled card catalog script not found');
          const ctx={window:{}};
          vm.runInNewContext(first,ctx,{timeout:10000});
          if(!ctx.window.CardData || ctx.window.CardData.cards.length<100)
            throw new Error('Card catalog did not initialize; Command Table would hang on loading screen');
          console.log('Card catalog booted with',ctx.window.CardData.cards.length,'card records');
          JS
      - name: Install upstream Forge custom Android Maven plugin
        run: |
          D="$HOME/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2"
          mkdir -p "$D"
          curl --fail --location --retry 3 --output "$D/android-maven-plugin-4.6.2.jar" https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar
          curl --fail --location --retry 3 --output "$D/android-maven-plugin-4.6.2.pom" https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom
          test -s "$D/android-maven-plugin-4.6.2.jar"
          test -s "$D/android-maven-plugin-4.6.2.pom"
      - name: Compile embedded Forge Android APK
        run: |
          cd /tmp/forge
          mvn -B -ntp -pl forge-gui-android -am -P android-dev-build -Dmaven.test.skip=true -Dandroid.sdk.path="${ANDROID_SDK_ROOT}" -Dandroid.buildToolsVersion=35.0.0 verify
      - name: Verify embedded runtime, deck validation and UI are packaged
        run: |
          test -s /tmp/forge/forge-gui-android/assets/command-table.html
          grep -q 'ctHydrateForgeState' /tmp/forge/forge-gui-android/assets/command-table.html
          grep -q 'deck.validate' /tmp/forge/forge-gui-android/assets/command-table.html
          grep -q 'CommandTableMain' /tmp/forge/forge-gui-android/src/main/AndroidManifest.xml
          grep -q 'CommandTableBootstrap' /tmp/forge/forge-gui-android/src/main/AndroidManifest.xml
          test -s /tmp/forge/forge-gui-android/assets/command-table-forge-resources.zip
          grep -q 'CommandTableOverlay' /tmp/forge/forge-gui-android/src/forge/app/CommandTableMain.java
          grep -q 'case "match.start"' /tmp/forge/forge-gui-android/src/forge/app/CommandTableOverlay.java
          grep -q 'case "game.command"' /tmp/forge/forge-gui-android/src/forge/app/CommandTableOverlay.java
          echo 'Static integration contract checks passed; runtime gameplay still needs device testing.'
      - name: Verify sideload installer artifact
        run: |
          find /tmp/forge/forge-gui-android/target -name '*.apk' -type f -size +50M -print
          test -s /tmp/forge/forge-gui-android/assets/command-table-forge-resources.zip
          mkdir -p artifacts
          APK=$(find /tmp/forge/forge-gui-android/target -type f -name '*debugSigned.apk' | head -1)
          if [ -z "$APK" ]; then echo "No signed APK: refuse to distribute unsigned package"; exit 1; fi
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" artifacts/CommandTable-embedded-Forge-UNTESTED.apk
          unzip -t artifacts/CommandTable-embedded-Forge-UNTESTED.apk | tail -1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-table-recovery-build-diagnostics
          path: recovery-logs/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: command-table-embedded-forge-APK-UNTESTED
          path: artifacts/CommandTable-embedded-Forge-UNTESTED.apk
          retention-days: 14

  emulator-startup:
    name: Install and launch embedded Forge APK in emulator
    needs: embedded-forge-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: command-table-embedded-forge-APK-UNTESTED
          path: smoke-apk
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8192M
          disable-animations: true
          script: bash ci/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-table-recovery-startup-evidence
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 14

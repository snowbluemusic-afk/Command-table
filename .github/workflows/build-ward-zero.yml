name: Build Ward Zero Android APK
on:
  workflow_dispatch:
  push:
    branches: [ward-zero-apk]
    paths:
      - 'ward-zero/**'
      - '.github/workflows/build-ward-zero.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ward-zero
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ward-zero-debug-apk
          path: ward-zero/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

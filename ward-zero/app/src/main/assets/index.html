 constructor(){this.ac=null;this.timer=null;this.step=0;this.noiseBuffer=null;this.notes=[-12,null,-7,-10,-12,-5,null,-8,-12,null,-7,-15,-10,null,-17,-12]}

function createMaze(floor){
 const W=Math.min(37,27+2*Math.floor((floor-1)/5)),H=Math.min(29,21+2*Math.floor((floor-1)/6));
 const walls=Array.from({length:H},()=>Array(W).fill(1)),rooms=[];
 const entryX=(Math.floor(W/2)|1),stack=[[entryX,H-2]];walls[H-2][entryX]=0;

 // A hospital's corridors are open, with shortcuts, cross-wings and treatment bays.

 win:()=>{if(!game)start(false);game.floor=20;end(true)},
 dead:()=>{if(!game)start(false);end(false)},
 movieTick:s=>{cinemaTime=s;render()},
 map:()=>game?.map?{W:game.map.W,H:game.map.H,walls:game.map.walls,start:game.map.start,exit:game.map.exit,rooms:game.map.rooms,props:game.map.props,routeLength:game.routeLength,needsKeycard:game.needsKeycard}:null,
 moveToExit:()=>{if(!game)start(false);game.player.x=game.map.exit.x+.5;game.player.y=game.map.exit.y+.5;update(.02)}
 }}
resize();updateHUD();mainMenu();requestAnimationFrame(frame);
})();
</script>
</body>

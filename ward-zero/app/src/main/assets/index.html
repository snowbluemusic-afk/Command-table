<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d',{alpha:false}), area=$('gameArea');
const overlay=$('overlay'), modal=$('modalContent'), feedEl=$('feed');
const FLOOR_NAMES=['EMERGENCY ADMISSIONS','OUTPATIENT CLINIC','DIAGNOSTIC IMAGING','SURGICAL PREP','WEST WING','PATHOLOGY LAB','MEDICAL STORAGE','CARDIAC UNIT','DARK WARD','PHARMACY','INTENSIVE CARE','ISOLATION WARD','NEUROLOGY','PAEDIATRICS','RESEARCH LAB','OPERATING THEATRES','BIOHAZARD WING','EXECUTIVE WARD','ROOFTOP ACCESS','HELIPAD'];
const T=32, R=8, SAVE='ward-zero-v1-save', BEST='ward-zero-v1-best';
const store={getItem:k=>{try{return window.localStorage.getItem(k)}catch(e){return null}},setItem:(k,v)=>{try{window.localStorage.setItem(k,v)}catch(e){}},removeItem:k=>{try{window.localStorage.removeItem(k)}catch(e){}}};
const colors={floor:'#18282d',wall:'#334147',blood:'#9a3038',light:'#d2d9bd',accent:'#d4af73'};
let width=800,height=500,dpr=1,mode='menu',last=0,game=null,camera={x:0,y:0},particles=[],messages=[],shake=0,flash=0,sound=true,anim=0,mouse={x:0,y:0};
let key={up:false,down:false,left:false,right:false,fire:false},mapShown=false,breachSound=false;
let saved=null;try{saved=JSON.parse(store.getItem(SAVE)||'null')}catch(_){ }
const rnum=(lo,hi)=>Math.random()*(hi-lo)+lo;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const floor2=n=>String(n).padStart(2,'0');
const rnd=(a,b)=>Math.floor(rnum(a,b+1));
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function TILE(x,y){return `${x},${y}`}
const blueprints={
 player:[
'......KKKK......','.....KSSSSK.....','.....KSSSSK.....','......KSSK......','.....KKBBKK.....','....KBBL LBBK...'.replace(' ',''),'....KBBBBBBK....','....KBBKKBBK....','......KBBK......','......KBBK......','.....KBBBBK.....','.....KB..BK.....','.....KB..BK.....','....KNN..NNK....','....KNN..NNK....','................'],
 zombie:[
'......KKKK......','.....KGGGGK.....','.....KG R GK.....'.replaceAll(' ',''),'.....KGGGGK.....','......KGGK......','....KRRRRRRK....','...KGRRRRRRGK...','...KGRRRRRRGK...','....KRRKKRRK....','......KRRK......','......KRRK......','.....KRRRRK.....','.....KG..GK.....','.....KG..GK.....','.....KK..KK.....','................'],
 herb:[
'................','.......G........','......GGG.......','......G.G.......','...G..GGG..G....','..GGG.GGG.GGG...','...GGGGGGGGG....','.....GGGGGG.....','......GGGG......','.......G........','.......G........','.....KGGGK......','.....KGGGK......','.....KKKKK......','................','................'],
 gun:[
'................','................','................','..KKKKKKKKKK....','..KLLLLLLLK....','..KKKKKKKKKKK...','.....KK...KKK...','.....KK.........','.....KK.........','.....KLLK.......','.....KLLK.......','.....KLLK.......','......KK........','................','................','................'],
 ammo:[
'................','................','...KKKKKKKKKK...','..KYYYYYYYYK....','..KYYKKKYYYK....','..KYYKKKYYYK....','..KYYYYYYYYK....','..KYYYYYYYYK....','..KYYKKKYYYK....','..KYYKKKYYYK....','..KYYYYYYYYK....','...KKKKKKKKKK...','................','................','................','................'],
 map:[
'................','...KKKKKKKKK....','..KCCCCCCCCK....','..KCCC K CCK....'.replaceAll(' ',''),'..KCCKKKCCCK....','..KCCCCCCCCK....','..KCKCKKCCCK....','..KCKCCCKCCK....','..KCCCKKCCCK....','..KCCCCCCCCK....','..KCKCCCKCCK....','..KCCCCCCCCK....','...KKKKKKKKK....','................','................','................']
};
const palettes={K:'#172328',S:'#d4ab85',B:'#456c85',L:'#f2cb77',N:'#25333c',G:'#8bb36d',R:'#9f454c',Y:'#edbf62',C:'#b6cabb'};
function spriteBuild(rows){let c=document.createElement('canvas');c.width=c.height=16;let c2=c.getContext('2d');rows.forEach((line,y)=>[...line].slice(0,16).forEach((ch,x)=>{if(palettes[ch]){c2.fillStyle=palettes[ch];c2.fillRect(x,y,1,1)}}));return c}
const sprites={};Object.entries(blueprints).forEach(([n,b])=>sprites[n]=spriteBuild(b));
class Sfx{
 constructor(){this.ac=null;this.timer=null;this.step=0;this.notes=[-5,null,-5,-8,-5,null,-3,-1,-5,null,-5,-10,-8,null,-12,-10]}
 ensure(){if(!sound)return;if(!this.ac)try{this.ac=new(window.AudioContext||window.webkitAudioContext)()}catch(_){};if(this.ac?.state==='suspended')this.ac.resume();if(this.ac&&!this.timer){this.timer=setInterval(()=>this.tick(),240)}}
 tone(f,d=.10,type='square',vol=.035,when=0){if(!this.ac||!sound)return;let t=this.ac.currentTime+when,o=this.ac.createOscillator(),g=this.ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0005,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(this.ac.destination);o.start(t);o.stop(t+d+.03)}
 tick(){if(!sound||mode!=='playing'||!this.ac)return;let st=this.step++, note=this.notes[st%this.notes.length],speed=game?.floor||1;if(note!==null){let f=220*Math.pow(2,note/12);this.tone(f,.19,'triangle',.027);if(st%4===0)this.tone(f/2,.32,'sawtooth',.009)}if(st%8===0)this.tone(55,.16,'sine',.038);if(st%4===2&&speed>7)this.tone(130,.07,'square',.014)}
 play(type){this.ensure();if(type==='shoot'){this.tone(130,.055,'sawtooth',.11);this.tone(68,.13,'triangle',.09,.03)}if(type==='pick'){this.tone(500,.11,'square',.025);this.tone(740,.13,'triangle',.027,.10)}if(type==='hurt'){this.tone(83,.22,'sawtooth',.10)}if(type==='stairs'){[380,470,610,800].forEach((n,i)=>this.tone(n,.18,'triangle',.035,i*.10))}if(type==='breach'){this.tone(113,.36,'sawtooth',.060);this.tone(75,.41,'square',.02,.24)}if(type==='win'){[330,440,550,660,880].forEach((n,i)=>this.tone(n,.22,'triangle',.05,i*.16))}}
}
const sfx=new Sfx();
function notify(t,color='#e6d1a3'){messages.push({t,color,at:performance.now()+2300});feedEl.textContent=t;feedEl.style.color=color;feedEl.classList.add('show')}
function setOverlay(html){modal.innerHTML=html;overlay.classList.remove('hidden')}
function clearOverlay(){overlay.classList.add('hidden')}
function mainMenu(){mode='menu';const best=+store.getItem(BEST)||1; $('highScore').textContent=`BEST FLOOR: ${floor2(best)}`;
setOverlay(`<div class="kicker">ST. DYSMAS HOSPITAL · 03:17 A.M.</div><h1 class="big">WARD <span class="red">ZERO</span></h1><div class="subtitle">20 FLOORS. ONE WAY OUT.</div><div class="rule"></div><p class="brief">The city has fallen. A helicopter waits on the hospital roof. Each floor is a <em>new maze</em>. Five seconds after arrival, the stairwell breaches. The horde <em>doubles with every floor</em>.</p><div class="features"><span><b>10 HP</b> TO LIVE</span><span><b>20</b> PROCEDURAL FLOORS</span><span><b>1</b> LAST FLIGHT</span></div><button class="primary" id="startRun">ENTER THE HOSPITAL</button>${saved?'<button class="secondary" id="resumeRun">RESUME SAVED RUN</button>':''}<div class="intro-meta">FIND <b>HERBS</b> · SCAVENGE <b>AMMO</b> · CLAIM A <b>GUN</b> · FOLLOW <b>MAPS</b></div>`);
$('startRun').onclick=()=>start(false);if(saved)$('resumeRun').onclick=()=>start(true)}
function createMaze(floor){
 const W=Math.min(37,27+2*Math.floor((floor-1)/5)),H=Math.min(29,21+2*Math.floor((floor-1)/6));
 const walls=Array.from({length:H},()=>Array(W).fill(1)),rooms=[];
 const entryX=(Math.floor(W/2)|1);const stack=[[entryX,H-2]];walls[H-2][entryX]=0;
 while(stack.length){let [x,y]=stack[stack.length-1],dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-.5).filter(([dx,dy])=>x+dx>0&&y+dy>0&&x+dx<W-1&&y+dy<H-1&&walls[y+dy][x+dx]);if(dirs.length){let [dx,dy]=dirs[0];walls[y+dy/2][x+dx/2]=0;walls[y+dy][x+dx]=0;stack.push([x+dx,y+dy])}else stack.pop()}
 // Selective shortcuts turn the pure labyrinth into a navigable hospital floor plan.
 for(let i=0;i<W*H*.07;i++){let x=rnd(2,W-3),y=rnd(2,H-3);if(walls[y][x]&&((!walls[y][x-1]&&!walls[y][x+1])||(!walls[y-1][x]&&!walls[y+1][x])))walls[y][x]=0}
 // Wards open into hallways: any carved pair stays connected.
 for(let k=0;k<5+Math.floor(floor/4);k++){let x=rnd(3,W-5),y=rnd(3,H-5),valid=0;for(let yy=y;yy<y+3;yy++)for(let xx=x;xx<x+3;xx++)valid+=!walls[yy][xx]?1:0;if(valid){for(let yy=y;yy<y+3;yy++)for(let xx=x;xx<x+3;xx++)walls[yy][xx]=0;rooms.push({x,y,w:3,h:3,type:rnd(0,3)})}}
 const start={x:entryX,y:H-2},exit={x:entryX,y:1};walls[exit.y][exit.x]=0;
 return {W,H,walls,start,exit,rooms,detailSeed:rnd(0,999999)}
}
function walkable(x,y){return game&&y>=0&&y<game.map.H&&x>=0&&x<game.map.W&&game.map.walls[y][x]===0}
function bfs(sx,sy){let {W,H,walls}=game.map,a=new Int16Array(W*H).fill(-1),q=[sy*W+sx],head=0;a[sy*W+sx]=0;while(head<q.length){let idx=q[head++],x=idx%W,y=Math.floor(idx/W),d=a[idx]+1;for(let [dx,dy] of [[0,1],[1,0],[0,-1],[-1,0]]){let nx=x+dx,ny=y+dy,j=ny*W+nx;if(nx<0||nx>=W||ny<0||ny>=H||walls[ny][nx]||a[j]!==-1)continue;a[j]=d;q.push(j)}}return a}
function availableSpots(){let {W,H,walls}=game.map,a=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(!walls[y][x])a.push({x,y});return a}
function setupFloor(floor){let map=createMaze(floor);game.floor=floor;game.map=map;game.player={x:map.start.x+.5,y:map.start.y+.5,dir:{x:0,y:-1},invuln:0,shot:0,walk:0};game.wave=Math.pow(2,floor-1);game.pending=game.wave;game.spawnTime=0;game.elapsed=0;game.zombies=[];game.pickups=[];game.explored=new Set();game.route=[];game.pathTimer=0;game.flow=null;game.routeTimer=0;game.killsFloor=0;game.fog=map.rooms;game.hasMap=false;game.mapWasOpened=false;breachSound=false;mapShown=false;particles=[];shake=0;flash=0;
 let fromStart=bfs(map.start.x,map.start.y),fromExit=bfs(map.exit.x,map.exit.y),spots=availableSpots().filter(p=>fromStart[p.y*map.W+p.x]>4&&fromExit[p.y*map.W+p.x]>1);
 function place(kind,preferred=12){let eligible=spots.filter(p=>Math.abs(p.x-map.exit.x)+Math.abs(p.y-map.exit.y)>2&&game.pickups.every(o=>Math.abs(o.x-p.x)+Math.abs(o.y-p.y)>3));if(!eligible.length)return;eligible.sort((a,b)=>Math.abs(fromStart[a.y*map.W+a.x]-preferred)-Math.abs(fromStart[b.y*map.W+b.x]-preferred));let pick=eligible[Math.min(eligible.length-1,rnd(0,Math.min(5,eligible.length-1)))];game.pickups.push({x:pick.x+.5,y:pick.y+.5,kind,phase:rnum(0,7)})}
 if(!game.gun)place('gun',5);if(game.hp<8||floor%3===0)place('herb',10);if(game.gun||floor>1)place('ammo',15);place('map',8);if(Math.random()<.38)place(Math.random()<.5?'herb':'ammo',24);
 // Stationary infected are present before the stairwell alarm; capped to preserve space to escape.
 let count=Math.min(10,Math.floor(floor*.57));let possible=spots.filter(p=>fromStart[p.y*map.W+p.x]>9&&fromExit[p.y*map.W+p.x]>4);for(let i=0;i<count&&possible.length;i++){let j=rnd(0,possible.length-1),s=possible.splice(j,1)[0];createZombie(s.x+.5,s.y+.5,false)}
 reveal();updateHUD();notify(`FLOOR ${floor2(floor)}  /  ${FLOOR_NAMES[floor-1]}`);if(floor>1)saveRun();
}

resize();updateHUD();mainMenu();requestAnimationFrame(frame);
})();

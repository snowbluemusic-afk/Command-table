.ct10-scene:after{content:'';pointer-events:none;position:absolute;inset:0;border:9px solid transparent;box-shadow:inset 0 0 65px 10px #0008;z-index:0}
.ct10-scene>div:not(.ct10-inspect){z-index:1}
.ct10-top-tools{position:absolute;top:2.5%;left:1.4%;right:1.5%;display:flex;align-items:center;gap:7px;z-index:8!important;pointer-events:none}
.ct10-top-tools>*{pointer-events:auto}
.ct10-top-tools .ct10-phase-badge{padding:7px 13px;border-radius:99px;background:#0b171acf;border:1px solid #dcb66d49;color:#f9dba7;font-size:clamp(9px,1vw,13px);font-weight:800;letter-spacing:1.2px;text-shadow:0 1px 3px #000}
.ct10-phase-badge b{color:#faf3e2;font-weight:900}
.ct10-top-tools button{background:#0b2023ad;border:1px solid #f3db956b;color:#efe3cc;border-radius:50%;width:31px;height:31px;font-size:15px;font-weight:bold;display:grid;place-items:center}
.ct10-top-tools button:nth-child(2){margin-left:auto}
.ct10-focused-opponent{position:absolute;top:4.1%;left:36%;width:37%;z-index:3!important;pointer-events:none}
.ct10-opponent-badge{pointer-events:auto;display:flex;align-items:center;gap:7px;width:100%;max-width:350px;margin:auto;padding:3px 8px;border:1px solid #c5b18d6d;border-radius:13px;background:linear-gradient(#1d292cb8,#09161be2);box-shadow:0 7px 18px #0007}
.ct10-opponent-badge.active{border-color:#9cd0ff;box-shadow:0 0 22px #43bcff58,0 7px 15px #0007}
.ct10-opponent-badge.under-attack{border-color:#f0a46c;box-shadow:0 0 18px #f26c5a7e}
.ct10-op-avatar{flex:none;width:36px;height:36px;border-radius:8px;overflow:hidden;background:#65523e;border:1px solid #d4b98366;padding:0;box-shadow:0 2px 8px #0009}
.ct10-op-avatar img{display:block;width:100%;height:100%;object-fit:cover}
.ct10-op-name{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.ct10-op-name span{color:#e3b87e;font-size:8px;font-weight:900;letter-spacing:1px}
.ct10-op-name strong{font:700 clamp(11px,1.25vw,17px) Georgia,serif;color:#f6efde;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct10-life{border-radius:99px;background:radial-gradient(circle at 30% 20%,#6e3e35,#331920 80%);color:#fff1e5;min-width:61px;min-height:34px;border:1px solid #e5b1a1;box-shadow:0 2px 12px #0008;font:700 20px Georgia,serif;padding:3px 9px;text-shadow:0 2px 3px #000}
.ct10-opp-support,.ct10-opp-creatures,.ct10-own-creatures,.ct10-own-support{position:absolute;min-width:0;min-height:0;display:flex;align-items:center}
.ct10-opp-support{left:9%;top:13%;height:13%;width:53%}
.ct10-opp-creatures{left:32%;top:28%;height:18%;width:53%}
.ct10-own-creatures{left:32%;top:50%;height:19%;width:53%}
.ct10-own-support{left:12%;top:69%;height:15%;width:42%}
.ct10-lane{display:flex;flex-direction:row;align-items:center;gap:clamp(1px,.38vw,6px);min-width:0;width:100%;height:100%;overflow:auto hidden;scrollbar-width:none;padding:2px 4px;justify-content:flex-start}
.ct10-lane::-webkit-scrollbar{display:none}
.ct10-zone-empty{color:#f7e9c437;font-size:10px;letter-spacing:1px;font-style:italic}
.ct10-stage .ct10-lane .game-card{flex:0 0 auto;width:clamp(46px,6.1vw,94px);min-width:0;height:clamp(62px,15.5dvh,122px);max-height:98%;border:2px solid #181919;border-radius:7px;box-shadow:0 10px 13px #000a,0 0 1px 1px #a6a4a45c;transition:filter .15s,transform .15s,box-shadow .15s}
.ct10-stage .ct10-lane.ct10-support .game-card{width:clamp(39px,4.7vw,75px);height:clamp(53px,13dvh,105px)}
.ct10-stage .ct10-lane .game-card.tapped{transform:rotate(12deg) scale(.93);opacity:.8}
.ct10-stage .ct10-lane .game-card.ct-legal-target{box-shadow:0 0 0 3px #4bf2fc,0 0 21px #4bf2fc}
.ct10-stage .ct10-lane .gc-nameplate{min-height:14px;padding:4px 3px 2px}
.ct10-stage .ct10-lane .gc-nameplate strong{font-size:clamp(7px,.85vw,10px)}
.ct10-midline{position:absolute;top:47.2%;left:11%;width:73%;height:3px;border-radius:100%;background:linear-gradient(90deg,transparent,#edd2a54d 20%,#efdfb1a9 51%,#d3bb7945 83%,transparent);box-shadow:0 0 13px #f4d1a835;display:grid;place-items:center;z-index:2!important}
.ct10-midline>span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#234446b5;color:#f6e3ab;font-size:17px;text-shadow:0 0 15px #f9dd8e}
.ct10-midline-combat{height:5px;background:linear-gradient(90deg,transparent,#ffa344a4,#fff3bc,#ffa344a4,transparent);box-shadow:0 0 25px #fa9c55}
.ct10-midline-combat>strong{color:#ffe1b4;padding:5px 12px;background:#4c2820d9;border:1px solid #f2b580;border-radius:19px;font-size:12px;white-space:nowrap;box-shadow:0 0 15px #ef9b50ad}
.ct10-own-player{position:absolute;left:1.3%;bottom:10%;display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#122429eb,#15272c9c);padding:6px 8px;border-radius:12px;border:1px solid #c6ab7b50;max-width:160px;z-index:5!important}
.ct10-own-player .ct10-op-avatar{height:39px;width:39px}
.ct10-own-player .ct10-life{font-size:18px;min-width:47px;min-height:29px;padding:2px 6px}
.ct10-own-player small{position:absolute;left:5px;bottom:-18px;color:#ebd0aa;font-size:10px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct10-cycle{position:absolute;right:1.4%;top:36%;z-index:7!important;display:flex;align-items:center;gap:2px;padding:3px;background:#071a1dcc;border:1px solid #d5be9059;border-radius:25px}
.ct10-cycle button{background:none;border:0;border-radius:50%;width:29px;height:32px;color:#efd29e;font-size:24px}
.ct10-cycle span{font-size:10px;color:#ffe7bc;padding:0 2px}
.ct10-action-wrap{position:absolute;right:2%;bottom:8%;width:clamp(125px,18vw,240px);z-index:6!important}
.ct10-action-wrap .ct-phase-actions{position:static!important;width:100%;height:auto!important;min-height:0!important;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:4px}
.ct10-action-wrap .ct-phase-actions .ct-action-context{font-size:10px;text-align:center;color:#f1d6b9;text-shadow:0 2px 4px #000a}
.ct10-action-wrap .ct-phase-actions .primary{width:100%;min-height:40px;font:700 clamp(12px,1.55vw,18px) Georgia,serif;background:linear-gradient(#ffd590,#ffa052 45%,#c65c2d);color:#2e1c13;border:2px solid #ffbb75;border-radius:40px;box-shadow:0 0 0 3px #f1874333,0 0 24px #f28c4085,0 8px 15px #000a;padding:8px 6px;white-space:normal}
.ct10-action-wrap .ct-attack-choose{display:flex;flex-direction:column;width:100%;color:#fbdda7;gap:3px;font-size:9px}
.ct10-action-wrap .ct-attack-choose select{width:100%!important;background:#10272b!important;font-size:11px!important;padding:3px 6px!important}
.ct10-action-wrap .ct-auto-actions button{min-height:35px!important}
.ct10-combat-trace{position:absolute;top:44%;left:49%;font-size:24px;color:#ffe5b0;text-shadow:0 0 17px #fa8936;pointer-events:none;animation:ct10-battlebeat .8s ease-in-out infinite alternate}
@keyframes ct10-battlebeat{from{opacity:.5;transform:translateY(-3px)}to{opacity:1;transform:translateY(4px)}}
.ct10-stack{position:absolute;right:3%;top:22%;background:#112939e8;color:#dff7ff;border:1px solid #90d9ff;border-radius:20px;padding:7px 13px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:6!important;font-size:10px}
.ct10-target-prompt{position:absolute;top:18%;right:1%;max-width:240px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:#104452e7;border:2px solid #55e6fc;border-radius:12px;padding:10px;color:white;z-index:9!important}
.ct10-target-prompt strong,.ct10-target-prompt span{width:100%;font-size:11px}.ct10-target-prompt button{background:#153640;border:1px solid #a9faff;border-radius:9px;color:white;padding:5px 8px}
.ct10-inspect{position:absolute;z-index:9!important;right:1%;top:17%;width:clamp(145px,22vw,280px);max-height:63%;border:1px solid #c9ab79;border-radius:12px;background:linear-gradient(145deg,#1a2423f0,#0d1a1dfa);box-shadow:0 8px 32px #000d;padding:10px;display:flex;flex-direction:column;gap:7px;overflow:auto}
.ct10-inspect>img{max-width:100%;max-height:29dvh;object-fit:contain;border-radius:6px;align-self:center}
.ct10-inspect-close{position:absolute;right:7px;top:5px;background:#14242bdd;border:1px solid #ead8ac66;border-radius:50%;width:25px;height:25px;color:white;font-size:17px;z-index:2}
.ct10-inspect-info{display:flex;flex-direction:column;gap:5px;color:#f1e3ce;font-size:11px;line-height:1.3}.ct10-inspect-info>span{font-size:10px;color:#b8cfc9;max-height:55px;overflow:auto}.ct10-inspect-info button{padding:5px;font-size:11px}
.ct10-hand-wrap{position:absolute;bottom:-5px;left:26%;width:55%;height:clamp(93px,25dvh,175px);z-index:5!important;pointer-events:none}
.ct10-hand-wrap>*{pointer-events:auto}
.ct10-hand-ribbon{display:flex;align-items:center;justify-content:center;gap:13px;color:#ecd7ae;font-size:10px;height:19px;opacity:.9;text-shadow:0 2px 3px #000d}
.ct10-hand-ribbon button{border:0;background:none;color:#f7dfb2;font-size:10px;font-weight:900;letter-spacing:1px}
.ct10-hand-ribbon b{background:#7d5835;border-radius:50%;padding:2px 5px}
.ct10-hand-fan{position:relative;display:flex;align-items:flex-start;justify-content:center;height:calc(100% - 19px);width:100%;padding:0 6px;overflow:visible;pointer-events:none}
.ct10-hand-slot{flex:0 0 auto;position:relative;margin-right:clamp(-25px,-1.8vw,-12px);transform:translateY(var(--dip)) rotate(var(--tilt));transform-origin:50% 85%;z-index:calc(10 + var(--order));transition:transform .18s ease;pointer-events:auto}
.ct10-hand-slot:last-child{margin-right:0}
.ct10-hand-slot:hover,.ct10-hand-slot:has(.chosen){transform:translateY(-21px) scale(1.13) rotate(0deg);z-index:90}
.ct10-stage .ct10-hand-slot .game-card{width:clamp(53px,7.1vw,110px);min-width:0;height:clamp(78px,22dvh,148px);border:2px solid #242321;border-radius:7px;box-shadow:0 7px 13px #000b,0 0 2px #dbc397}
.ct10-stage .ct10-hand-slot .game-card.available{border-color:#46e7ff;box-shadow:0 0 11px #4cf3fa82,0 8px 13px #000a}
.ct10-stage .ct10-hand-slot .gc-nameplate{padding:7px 2px 3px;min-height:19px}.ct10-stage .ct10-hand-slot .gc-nameplate strong{font-size:clamp(7px,.75vw,10px)}
.ct10-watch-pill{position:absolute;bottom:90%;left:30%;background:#102a2cd6;border:1px solid #bfb38d;border-radius:16px;padding:4px 8px;color:#f7dcb0;font-size:10px;white-space:nowrap}
.ct10-watch-pill button{background:none;color:#e3cc98;border:0;padding:0 5px}
.ct10-overview{position:absolute;top:15%;left:11%;width:73%;height:66%;padding:9px;border:1px solid #ad9270;border-radius:15px;background:#0a1b1edb;box-shadow:0 10px 40px #000a;z-index:7!important}

function featuredDeck(f){
 const commander=card(f.commander), identity=colors(commander);
 const nonbasics=['Command Tower','Path of Ancestry','Exotic Orchard','City of Brass','Mana Confluence'];
 const pool=DB.filter(c=>c.implemented&&!isLand(c)&&!isCommander(c)&&c.name!=='Rusted Relic'&&colors(c).every(x=>identity.includes(x)));
 const chosen=[];const add=n=>{const c=card(n);if(c.implemented && !isLand(c) && c.name!==f.commander && colors(c).every(x=>identity.includes(x)) && !chosen.some(x=>equalName(x,n)))chosen.push(n);};
 f.priority.forEach(add);
 const curve=c=>{const {generic,required}=parseCost(c);return generic+required.length;};
 const ranked=[...pool].sort((a,b)=>{
   const affinity=c=> (isCreature(c)&&c.type.includes(f.key==='pantlaza'?'Dinosaur':f.key==='edgar'?'Vampire':f.key==='angels'?'Angel':f.key==='goblins'?'Goblin':'___')?50:0)
      + (['yshtola','vivi','drakes'].includes(f.key) &&(isInstant(c)||isSorcery(c))?25:0)
      + (curve(c)<=4?5:0) + (c.effect?.startsWith('mana')?8:0);
   return affinity(b)-affinity(a) || curve(a)-curve(b) || a.name.localeCompare(b.name);
 });
 ranked.forEach(c=>{if(chosen.length<61)add(c.name);});
 // 61 nonlands + 38 lands = 99 cards in the library; no filler beyond normal basic lands.
 const colorToBasic={W:'Plains',U:'Island',B:'Swamp',R:'Mountain',G:'Forest'};
 const lands=nonbasics.slice();
 const basics=identity.map(c=>colorToBasic[c]);
 let i=0;while(lands.length<38){lands.push(basics[i++%basics.length]);}
 const cards=[...chosen,...lands];
 while(cards.length<99)cards.push(basics[i++%basics.length]);
 return {id:`prebuilt-${f.key}`,name:f.name,commander:f.commander,cards:cards.slice(0,99),prebuilt:true,theme:f.theme,popularity:f.popularity};
}

function deckArtNames() {

function requestDeckArtwork(force=false) {

function parseDecklist(raw){
 let commander='',deckName='',section='deck'; const names=[],errors=[],entries=[];
 const lines=String(raw||'').replace(/\uFEFF/g,'').split(/\r?\n/);
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();if(!line||line.startsWith('//')||line.startsWith('#'))continue;
  const header=line.replace(/:$/,'').toLowerCase();
  if(header==='about'||header==='description'){section='about';continue;}
  if(['commander','commanders','command zone','commandzone'].includes(header)){section='commander';continue;}
  if(['deck','main','mainboard','maindeck','main deck'].includes(header)){section='deck';continue;}
  if(['sideboard','maybeboard','considering','companions'].includes(header)){section='skip';continue;}
  if(section==='about'){
   const title=line.match(/^(?:name|deck name|title)\s*:?[ \t]*(.+)$/i);
   if(title){deckName=title[1].trim();continue;}
   continue;
  }
  if(section==='skip')continue;
  // Accept 1, 1x, 1 x and 1x. Also remove common export printings: (USG) 63.
  const match=line.match(/^(\d{1,3})\s*[xX]?\s+(.+)$/);
  if(!match){if(!/^name\s+/i.test(line))errors.push(`Line ${i+1}: ${line}`);continue;}
  const qty=Number(match[1]);if(qty<1||qty>100){errors.push(`Line ${i+1}: invalid quantity`);continue;}
  const rawName=match[2].trim();
  const name=rawName.replace(/\s+\([A-Z0-9]{2,8}\)\s*[A-Za-z0-9-]+\s*$/i,'').replace(/\s+\*.*$/,'').trim();
  if(!name){errors.push(`Line ${i+1}: missing card name`);continue;}
  entries.push({name,qty,section});
  if(section==='commander'){
   if(commander && !equalName(commander,name))errors.push('Multiple commanders detected; review your selection.');
   if(!commander)commander=name;
   for(let j=1;j<qty;j++)names.push(name);
  }else for(let j=0;j<qty;j++)names.push(name);
 }
 if(!commander&&names.length===100){const guess=names.find(n=>isCommander(card(n)));if(guess){commander=guess;names.splice(names.indexOf(guess),1);}}
 const unknown=[...new Set([commander,...names].filter(n=>n&&!hasMetadata(n)))];
 return {commander,deckName,names,unknown,entries,errors,cardCount:names.length+(commander?1:0)};
}
async function fetchScryfall(names){const unresolved=[];const chunks=[];for(let i=0;i<names.length;i+=70)chunks.push(names.slice(i,i+70));
 for(const group of chunks){try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),9000);
 let res;try{res=await fetch('https://api.scryfall.com/cards/collection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifiers:group.map(name=>({name}))}),signal:controller.signal});}finally{clearTimeout(timer);}if(!res.ok)throw new Error(`Scryfall HTTP ${res.status}`);const data=await res.json();for(const x of data.data||[]){if(hasMetadata(x.name))continue;const face=x.card_faces?.[0];const type=x.type_line||face?.type_line||'Unknown';const mana=x.mana_cost||face?.mana_cost||'';DB.push({id:x.id,name:x.name,cost:mana.replace(/[{}]/g,''),type,power:x.power||face?.power,toughness:x.toughness||face?.toughness,keywords:x.keywords||[],colors:x.colors||[],identity:x.color_identity||[],text:x.oracle_text||face?.oracle_text||'',implemented:false,image:x.image_uris?.normal||face?.image_uris?.normal||null});}
 for(const un of data.not_found||[])unresolved.push(un.name||'Unknown');}catch(e){unresolved.push(...group);}}
 saveCustomCards();return unresolved;}

async function importDeck(){
 const draft=app.importDraft;if(!draft)return announce('Paste a deck list to import.');

 const commander=($('#importCommander')?.value||draft.commander||'').trim();
 if(!commander){app.notice='Choose a commander before importing.';render();return;}
 // If a 100-card export puts the commander in the main deck, extract exactly
 // one copy instead of silently saving an illegal 101-card deck.
 const names=[...draft.names];
 const mainCommanderIndex=names.findIndex(n=>equalName(n,commander));
 if(mainCommanderIndex>=0)names.splice(mainCommanderIndex,1);
 // Replacing a commander already separated from the main deck must not
 // silently lose the previous named commander.
 if(draft.commander&&!equalName(draft.commander,commander)&&mainCommanderIndex>=0)names.push(draft.commander);
 const unknown=[...new Set([commander,...names].filter(n=>n&&!hasMetadata(n)))];
 app.onlineBusy=true;app.notice=`Saving ${names.length+1} cards…`;
 // Don't rerender the modal before saving; prevent double-submit instead.
 const btn=$('[data-action="confirmImport"]');if(btn)btn.disabled=true;
 const d={id:id(),name,commander:hasMetadata(commander)?card(commander).name:commander,cards:names};
 app.decks.push(d);app.editing=d.id;app.importDraft=null;app.modal='';app.view='edit';app.onlineBusy=false;
 app.notice=`Saved ${d.cards.length+1} cards in ${d.name}. ${unknown.length?`Looking up ${unknown.length} missing card records…`:'Card records ready.'} Unsupported cards remain deck-only until Forge integration.`;
 persist();render();scheduleDeckArtwork(true);
 if(unknown.length){
   let unresolved=unknown;
   try{unresolved=await fetchScryfall(unknown);}catch{}
   // No accidental navigation or overwritten edits while a slow request completes.
   const current=app.decks.find(x=>x.id===d.id);
   if(current){
     const missing=[current.commander,...current.cards].filter(n=>!hasMetadata(n));
     app.notice=missing.length?`${current.name} is saved. ${missing.length} card records couldn't be downloaded; retry online. Playing these cards requires the Forge engine.`:`${current.name} metadata saved. ${validate(current).unsupported} cards still need the Forge engine for gameplay.`;
     app.onlineBusy=false;persist();render();
   }
 }
}

let handSwipe=null;
root.addEventListener('pointerdown',e=>{if(app.modal==='hand'&&e.target.closest('.ct-zoom-swipe'))handSwipe={x:e.clientX,y:e.clientY};});
root.addEventListener('pointerup',e=>{if(!handSwipe)return;const dx=e.clientX-handSwipe.x,dy=e.clientY-handSwipe.y;handSwipe=null;if(Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.35){action(dx<0?'nextHand':'previousHand');ignoreClick=true;setTimeout(()=>{ignoreClick=false;},90);}});
root.addEventListener('pointercancel',()=>{handSwipe=null;});
document.addEventListener('keydown',e=>{if(app.modal!=='hand')return;if(e.key==='Escape'){action('closeModal');e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){action(e.key==='ArrowLeft'?'previousHand':'nextHand');e.preventDefault();}});
root.addEventListener('input',e=>{if(e.target.id==='searchInput'){app.search=e.target.value;const d=app.decks.find(x=>x.id===app.editing);const matched=DB.filter(c=>c.name.toLowerCase().includes(app.search.toLowerCase())).slice(0,38);const node=$('#searchResults');if(node)node.innerHTML=searchRows(matched,d);}});
root.addEventListener('change',e=>{if(e.target.id==='attackPlayer'){const idx=app.game?.players.findIndex(p=>p.id===e.target.value)??-1;if(idx>0){app.attackTarget=idx;app.focusPlayer=idx;app.tableMode='focus';render();}return;}if(e.target.id==='cacheWifiOnly'){
   if(hasNativeArt){try{window.AndroidBridge.setArtworkWifiOnly(!!e.target.checked);}catch{}scheduleDeckArtwork(true);}render();return;
 } if(e.target.id==='deckName'){const d=app.decks.find(x=>x.id===app.editing);if(d){d.name=e.target.value;persist();render();}}
 else if(e.target.id==='commanderSelect'){const d=app.decks.find(x=>x.id===app.editing);if(d){d.commander=e.target.value;persist();render();}}
 else if(e.target.id==='homeDeck'){app.matchDeck=e.target.value;render();}
 else if(e.target.id==='importCommanderPick' && e.target.value){const el=$('#importCommander');if(el)el.value=e.target.value;}
 else if(e.target.id==='enemyDeck')app.enemyDeck=e.target.value;
 else if(e.target.id==='castTarget')app.target=e.target.value;
 else if(e.target.id==='attackPlayer')app.attackTarget=app.game.players.findIndex(p=>p.id===e.target.value);
 else if(e.target.dataset.action==='setBlock')app.blocks[e.target.dataset.value]=e.target.value;
});
render();
// The native cache updates images already on-screen without interrupting dragging.
window.commandTableCacheUpdated = (name, state) => {
  if (name && hasNativeArt) {
    let local='';try{local=window.AndroidBridge.artworkUrl(name);}catch{}
    if (local) for (const img of document.querySelectorAll('img[data-art-name]')) {
      if (img.dataset.artName===name && img.getAttribute('src')!==local) {
        img.style.display='block';img.setAttribute('src',local);
      }
    }
  }
  if (app.view==='artwork') {
    clearTimeout(artUiUpdateTimer);
    artUiUpdateTimer=setTimeout(()=>{if(app.view==='artwork'&&app.modal!=='hand')render();},800);
  }
};
window.commandTableRefreshArtwork=()=>scheduleDeckArtwork(true);
scheduleDeckArtwork();
window.commandTableBack=()=>{if(app.modal){app.modal='';render();}else if(app.view==='game'){app.modal='gameMenu';render();}else setView('home');};
window.CommandTableTest={FEATURED,featuredDeck,parseDecklist,validate,starter,card,app,startGame,castFrom,resolveOne,manaPlan,stats,turnPlayer,render,beginCastFromDrag,artUrl,action,cpuStep,autoAdvance,endTurn,beginCpuAttack,resolveCombat,canCast,fetchScryfall,importDeck};
window.CommandTableEngineStatus = () => ({protocol:CT_ENGINE_PROTOCOL, nativeForgeReady:CommandTableNative.ready, capabilities:CommandTableNative.capabilities});
void CommandTableNative.refreshStatus();
})();
</script></body></html>

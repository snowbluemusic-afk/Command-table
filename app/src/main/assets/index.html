function handleModal(act){if(act==='close'){dismiss();return}if(act==='accept'){dismiss();startRepair();return}if(act==='refuse'){dismiss();resolveRefusal(false);return}if(act==='report'){dismiss();resolveRefusal(true);return}if(act==='invoice'){showInvoice();return}if(act==='complete'){finishJob();return}if(act.startsWith('upgrade:')){const x=act.split(':')[1];buyUpgrade(x);return}if(act==='upgrades'){showUpgrades();return}if(act==='journal'){showJournal();return}if(act==='settings'){settings();return}if(act==='resetconfirm'){s=newGame();dismiss();shop();return}if(act==='reset'){modal('Start a new story?','This will reset the neighbourhood, coins and customer visits. This cannot be undone.',[{text:'Keep my shop',action:'close'},{text:'Start over',action:'resetconfirm',rose:true}]);return}}
function resolveRefusal(report){s.day++;s.visit++;s.notes.unshift(report?'Reported a suspicious console to the local constable; the youth centre was grateful.':'Declined to work on a console whose ownership seemed uncertain.');s.reputation+=report?2:1;job=activeJob();s.repair=null;mode='shop';shop();appToast(report?'The constable will help return it.':'You chose not to repair it.');}
function showInvoice(){const r=repairState(),base=job.cost,initial=clamp(Math.round(base*.9),0,200);$('modal').innerHTML=`<h2>✿ A fair price?</h2><p>You repaired ${esc(typeNames[job.type])} with care. Your work quality: <b>${r.quality}%</b>.<br>Choose what feels right.</p><input aria-label="Repair price" id="priceSlider" type="range" min="0" max="${Math.round(base*2)}" value="${initial}"><div class="price" id="priceLabel">${initial} coins</div><p class="note">Suggested price: ${base} coins. Generosity builds trust; very high prices can hurt word of mouth.</p><div class="grid"><button class="button" data-modal="complete">Return the treasured object</button></div>`;const slider=$('priceSlider');slider.oninput=()=>{$('priceLabel').textContent=slider.value+' coins'};}
function finishJob(){const r=repairState();if(!r||!r.tested)return;let price=Number($('priceSlider')?.value??job.cost),base=job.cost;const fair=price<=base*1.2;const generous=price<base*.6;const greedy=price>base*1.45;const score=r.quality;let repGain=greedy?-1:generous?3:fair?2:0;if(score<70)repGain--;s.reputation=clamp(s.reputation+repGain,0,99);s.coins+=price;s.repairs++;s.fixes+=score>70?1:0;s.visit++;s.day++;s.notes.unshift(`${people[job.who].name}'s ${typeNames[job.type]} · ${price} coins · ${score}% quality${greedy?' · pricey':generous?' · a generous favour':''}`);s.notes=s.notes.slice(0,40);if(!s.gifts.includes(job.gift)&&job.gift!=='?'&&!greedy)s.gifts.push(job.gift);s.repair=null;dismiss();shop();tone(670,.12);appToast(generous?'Your kindness is spreading around town.':greedy?'The price raised a few eyebrows.':'Another happy neighbour! Word is spreading.');}

function showUpgrades(){let cards=Object.entries(improvements).map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:7px;align-items:center;padding:7px;border-bottom:1px solid #dec5a5"><span style="font-size:12px;text-align:left">${v.emoji} <b>${k}</b><br><small>${v.desc}</small></span><button class="button mini" data-modal="upgrade:${k}" ${s.coins<v.price||s.upgrades.includes(k)?'disabled':''}>${s.upgrades.includes(k)?'Owned':v.price+' coins'}</button></div>`).join('');modal('Make it your own','');$('modal').innerHTML=`<h2>✿ A cosier corner</h2><p class="note">Decorations make the shop feel like home. No timer, no pressure.</p>${cards}<div class="grid"><button class="button alt" data-modal="journal">Journal</button><button class="button" data-modal="close">Return to work</button></div>`}
function buyUpgrade(k){const v=improvements[k];if(!v||s.coins<v.price||s.upgrades.includes(k))return;s.coins-=v.price;s.upgrades.push(k);s.reputation++;persist();updateHUD();appToast(`${k} added to the shop!`);showUpgrades()}
function settings(){modal('A gentle pace','Take your time. There are no timers, penalties for stopping, or ads.',[{text:s.muted?'Turn sound on':'Turn sound off',action:'togglesound'},{text:'Start a new story',action:'reset',rose:true},{text:'Back to the shop',action:'close'}]);$('modal').querySelector('[data-modal="togglesound"]').onclick=()=>{s.muted=!s.muted;persist();settings()}}
$('journalButton').onclick=showJournal;$('settingButton').onclick=settings;
// The standalone prototype is playable without a connection, and game state is saved locally.
shop();if(s.repair){mode='bench';draw()}
})();
</script></body></html>

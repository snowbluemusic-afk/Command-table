<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f3e6c7" />
  <title>The Mending Hour</title>
  <style>
:root{--ink:#594d4c;--deep:#674f56;--paper:#fff9ea;--cream:#f4e8ce;--wall:#eee4b9;--rose:#d58d85;--rose-light:#f5d6cc;--sage:#789989;--sage-light:#d5e4d0;--gold:#d9a65d;--line:#8c716c;--shadow:rgba(76,54,58,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e6dcb4;color:var(--ink);font-family:'Trebuchet MS','Arial Rounded MT Bold',Arial,sans-serif;touch-action:manipulation}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #b97a73;outline-offset:3px}
#app{display:flex;flex-direction:column;height:100dvh;min-height:340px;overflow:hidden;background:var(--cream)}
.topbar{flex:0 0 66px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5;padding:8px 22px;background:#fff5de;border-bottom:3px solid #bba18a;box-shadow:0 2px 0 #f8e2b8}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.brand strong{display:block;line-height:1.1;font-family:Georgia,serif;font-size:clamp(17px,2vw,24px);color:#655055}.brand small{font-size:10px;letter-spacing:1px;color:#9f8172}.brand-flower{font-size:34px;color:#c98783;text-shadow:2px 2px #f4d4b0}
.stats{display:flex;align-items:center;gap:10px}.stat{display:flex;align-items:center;gap:5px;border:2px solid #cdb9a1;padding:4px 13px;border-radius:18px;background:#fffaf0;min-width:84px;justify-content:center;box-shadow:0 2px 0 #d7bf9d}.stat span{font-size:19px;color:#d49a66}.stat:nth-child(3) span{color:#c68491}.stat b{font-size:17px}.stat small{font-size:10px;color:#9a8174}
.top-actions{display:flex;gap:7px}.icon-button{border:2px solid #b89a89;background:#fbedd5;border-radius:11px;width:37px;height:34px;font-size:22px;color:var(--deep);box-shadow:0 2px #c8aa94}.icon-button:active{transform:translateY(2px);box-shadow:none}
main{flex:1;min-height:0;position:relative}.screen{width:100%;height:100%}.hidden{display:none!important}
.shop-screen{position:relative;isolation:isolate;background:#e5d9b0}.shop-art{position:absolute;inset:0;overflow:hidden}.shop-art svg{width:100%;height:100%;display:block;object-fit:cover}
.shop-overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 12px}.story-card{width:min(460px,48vw);min-height:210px;max-height:calc(100% - 76px);overflow-y:auto;pointer-events:auto;background:var(--paper);border:3px solid #806a69;border-radius:24px;box-shadow:8px 9px 0 rgba(98,70,65,.22),inset 0 0 0 6px #faedda;padding:17px 19px 16px;margin:auto 0 6px 3vw;position:relative}
.story-card:before{content:'✦';position:absolute;right:16px;top:9px;color:#dca87e;font-size:19px}.person-row{display:flex;align-items:center;gap:11px;margin-bottom:8px}.portrait{width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid #7e6265;background:#eedab8;flex-shrink:0}.portrait svg{width:100%;height:100%}.portrait.small{width:54px;height:54px}
.story-card .overline,.overline{color:#ad7f75;font-size:10px;letter-spacing:2px;font-weight:800;text-transform:uppercase}.story-card h2{font-family:Georgia,serif;font-size:23px;line-height:1;margin:3px 0 0;color:#655158}.story-card p{font-size:clamp(12px,1.2vw,15px);line-height:1.52;margin:10px 0 13px;max-width:440px}.story-actions{display:flex;flex-wrap:wrap;gap:8px}
.pill-btn{border:2px solid #795e60;background:#d9e6d3;color:#475d53;padding:9px 14px;border-radius:14px;font-weight:800;font-size:13px;box-shadow:0 3px #9a8b7d;white-space:normal}.pill-btn.secondary{background:#fff1da;color:#84655f}.pill-btn.rose{background:#f4cfca;color:#8c5459}.pill-btn:active{transform:translateY(3px);box-shadow:none}.pill-btn:disabled{opacity:.4;cursor:not-allowed}
.shop-bottom{display:flex;gap:10px;align-items:end;justify-content:space-between;min-height:42px}.welcome-note{color:#fff5df;background:#664c56c9;border:2px solid #b59a7d;padding:9px 15px;border-radius:16px;font-size:12px;text-shadow:0 1px #58434b}.gift-shelf{max-width:45%;display:flex;justify-content:end;gap:8px}.gift{font-size:23px;border:2px solid #876f67;border-radius:12px;background:#fff1d9e8;padding:4px 8px;box-shadow:0 2px #b08a6c}
.footer{height:29px;flex:0 0 29px;border-top:2px solid #bda791;background:#fcf1db;display:flex;align-items:center;justify-content:space-between;padding:4px 18px;font-size:10px;color:#8e746a;letter-spacing:.3px;gap:12px}.footer>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#87a98a;margin-right:7px}
.bench-screen{display:flex;background:#dfd5bd;gap:0}.case-panel{flex:0 0 min(26%,310px);background:#fff6df;border-right:4px solid #ac8c7e;display:flex;flex-direction:column;min-width:185px;padding:16px 15px 12px;box-shadow:inset -8px 0 #eee1c8;overflow-y:auto;gap:10px}.case-top h2{font-family:Georgia,serif;font-size:clamp(18px,2vw,24px);margin:8px 0 7px;color:#67515b}.case-top p{line-height:1.42;font-size:12px;margin:0;color:#88716b}
.customer-mini{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed #ddcbb5;border-bottom:2px dashed #ddcbb5}.customer-mini strong{font-family:Georgia,serif;font-size:15px;display:block}.customer-mini small{display:block;color:#947a75;font-size:11px;line-height:1.3;margin-top:3px}
.notebook{background:#fcf0d8;border:2px solid #ddc9aa;border-radius:12px;padding:9px 11px;flex:1}.notebook h3{font-family:Georgia,serif;font-size:14px;margin:0 0 6px;color:#81615c}.clue-list{display:flex;flex-direction:column;gap:6px}.clue{display:flex;gap:7px;font-size:11px;line-height:1.35;color:#786963}.clue:before{content:'✓';color:#799989;font-weight:900}.clue.muted{color:#baa899}.clue.muted:before{content:'○';color:#baa899}.case-bottom{padding-top:2px}.quiet-btn{color:#83635e;background:#fff8e9;border:2px solid #d5bba1;border-radius:12px;padding:7px 10px;font-size:11px;font-weight:700}
.work-panel{flex:1;display:flex;flex-direction:column;min-width:0;padding:9px 13px 10px;gap:8px;background:#e7d8bc}.work-top{display:flex;align-items:center;justify-content:space-between;padding:0 5px}.work-top h2{font-family:Georgia,serif;margin:1px 0;font-size:clamp(17px,2vw,23px);color:#5f5052}.step-count{font-size:12px;color:#9b8174;letter-spacing:2px}.work-mat{min-height:0;flex:1;position:relative;background:radial-gradient(ellipse at center,#b9c9b0 0%,#a1b6a3 72%,#90a895 100%);border:7px solid #c7a489;outline:3px solid #87695f;outline-offset:-3px;border-radius:23px;box-shadow:inset 0 6px 26px #708f784a,0 4px #c5b297;overflow:hidden;touch-action:none}
.work-mat:before{content:'';position:absolute;inset:13px;border:2px dashed #eaf0cd89;border-radius:16px;pointer-events:none}.corner-stitch{position:absolute;z-index:2;color:#d9e8c5;font-size:22px;opacity:.7}.top-left{top:13px;left:20px}.bottom-right{bottom:9px;right:18px}#repairSvg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.work-bottom{min-height:74px;flex:0 0 auto;background:#fff8e6;border:3px solid #ae8b7b;border-radius:15px;display:flex;align-items:center;gap:12px;padding:9px 15px;box-shadow:0 3px #c5ac96}.work-instruction{flex:1;min-width:0}.work-instruction strong{font-family:Georgia,serif;color:#6c515a;font-size:14px}.work-instruction p{font-size:11px;line-height:1.35;color:#8b6e65;margin:5px 0 0}.tool-area{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap;max-width:56%}.tool-chip{border:2px solid #9b7f75;background:#ede3ca;color:#7b625f;border-radius:12px;padding:7px 12px;font-weight:800;font-size:11px;box-shadow:0 2px #aa8d7b}.tool-chip.selected{background:#c8e1cf;color:#45695c}.tool-chip.rose{background:#f1d2ce;color:#8f575d}.tool-chip:active{transform:translateY(2px);box-shadow:none}
.floating-tip{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:#fff7e9db;border:1px solid #a38a7c;border-radius:10px;padding:4px 13px;color:#79615c;font-size:10px;pointer-events:none;opacity:0;transition:opacity .2s}.floating-tip.show{opacity:1}
.interactive{cursor:pointer;filter:drop-shadow(0 2px 1px #504b5040)}.interactive:hover .hit-circle,.interactive:focus .hit-circle{stroke:#fff7d6!important;stroke-width:5!important}.hit-circle{fill:#f9d39164;stroke:#fdf4d1;stroke-width:3;stroke-dasharray:7 5;animation:gentlePulse 2s ease-in-out infinite}.action-label{font-size:15px;fill:#fff7e8;font-weight:800;paint-order:stroke;stroke:#70565c;stroke-width:3;stroke-linejoin:round;pointer-events:none}.ghost-part{opacity:.65;stroke:#fffbe9;stroke-width:5;stroke-dasharray:9 7;fill:#fcf6d244}.piece{cursor:grab;touch-action:none}.piece.active{filter:drop-shadow(0 6px 3px #474a4e60)}.wire-line{fill:none;stroke:#f3d3ae;stroke-width:8;stroke-linecap:round}.port{cursor:pointer;stroke:#65575e;stroke-width:5}.port.selected{stroke:#fff5d3;stroke-width:8}.sparkle{fill:#fff9c5;animation:twinkle 1.9s infinite ease-in-out;transform-origin:center}.checkmark{fill:#5b8a74;stroke:#fff6df;stroke-width:4}
.modal-backdrop{position:fixed;inset:0;z-index:20;background:#51434d91;display:flex;justify-content:center;align-items:center;padding:14px}.modal{width:min(480px,92vw);max-height:calc(100dvh - 28px);overflow-y:auto;background:#fff9e8;border:4px solid #84655e;border-radius:26px;box-shadow:9px 12px 0 #51434d73,inset 0 0 0 6px #f4e4c8;padding:25px 25px 21px;text-align:center}.modal-emoji{font-size:43px;margin-bottom:4px}.modal h2{font-family:Georgia,serif;font-size:25px;line-height:1.08;margin:4px 0 12px;color:#76545b}.modal p{font-size:13px;line-height:1.55;margin:8px auto 17px;max-width:380px}.modal .story-actions{justify-content:center}.modal .note{font-size:11px;color:#a28778}.price-choice{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px}.price-choice input{width:min(280px,60vw);accent-color:#9a9581}.price-number{font-family:Georgia,serif;color:#75555d;font-size:25px;min-width:65px}.toast{position:fixed;bottom:42px;left:50%;transform:translate(-50%,20px);z-index:35;border:2px solid #85655d;border-radius:16px;background:#fff7e5;padding:10px 20px;box-shadow:0 5px 0 #927e6b;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:12px;max-width:86vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes gentlePulse{0%,100%{opacity:.7}50%{opacity:1}}@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@media(max-width:790px){.topbar{flex-basis:52px;padding:4px 10px;gap:6px}.brand-flower{font-size:26px}.brand strong{font-size:17px}.brand small{font-size:8px;letter-spacing:.4px}.stat{min-width:58px;padding:3px 5px;gap:3px}.stat span{font-size:14px}.stat b{font-size:13px}.stat small{display:none}.stats{gap:5px}.icon-button{height:29px;width:30px;font-size:16px}.story-card{margin-left:0;padding:12px 14px;min-height:0;width:min(400px,57vw)}.story-card h2{font-size:19px}.story-card p{font-size:11px;margin:6px 0 8px}.portrait{width:47px;height:47px}.pill-btn{font-size:11px;padding:7px 10px}.shop-overlay{padding:0 10px 7px}.welcome-note{font-size:9px;padding:7px 9px}.footer{height:24px;flex-basis:24px;font-size:9px}.case-panel{flex-basis:26%;padding:10px 8px;gap:7px}.customer-mini{padding:4px 0}.portrait.small{width:37px;height:37px}.case-top p,.customer-mini small,.clue{font-size:9px}.case-top h2{font-size:18px}.notebook{padding:7px}.notebook h3{font-size:12px}.work-panel{padding:6px 7px;gap:6px}.work-top h2{font-size:16px}.work-bottom{min-height:59px;padding:5px 8px}.work-instruction strong{font-size:12px}.work-instruction p{font-size:9px;margin:2px}.tool-chip{font-size:10px;padding:5px 8px}.step-count{font-size:10px}.modal{padding:17px;max-height:92dvh}.modal h2{font-size:22px}.modal p{font-size:12px}}
@media(max-height:450px){.story-card{max-height:calc(100% - 50px);min-height:0}.story-card p{line-height:1.33}.shop-bottom{min-height:28px}.work-top .overline{font-size:8px}.work-bottom{min-height:53px}.case-top p{line-height:1.26}.customer-mini{gap:5px}.notebook h3{margin-bottom:4px}}
@media(orientation:portrait){#app:after{content:'Rotate your phone for the cosiest view ↻';position:fixed;inset:0;background:#f6e9c7;color:#75555d;z-index:40;display:flex;justify-content:center;align-items:center;padding:40px;text-align:center;font-family:Georgia,serif;font-size:25px}}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-flower">✿</span><div><strong>The Mending Hour</strong><small>a little shop for second chances</small></div></div>
    <div class="stats"><div class="stat"><span>☀</span><b id="dayValue">1</b><small>day</small></div><div class="stat"><span>✧</span><b id="coinValue">45</b><small>coins</small></div><div class="stat"><span>♥</span><b id="heartValue">3</b><small>hearts</small></div></div>
    <div class="top-actions"><button class="icon-button" id="soundBtn" title="Sound" aria-label="Toggle sound">♫</button><button class="icon-button" id="journalBtn" title="Journal" aria-label="Journal">▤</button></div>
  </header>
  <main id="main">
    <section class="screen shop-screen" id="shopScreen">
      <div class="shop-art">
        <svg viewBox="0 0 1180 630" aria-label="A warmly lit whimsical repair shop" preserveAspectRatio="xMidYMid slice">

          <rect width="1180" height="630" fill="#e7dfb0"/><rect width="1180" height="410" fill="url(#wallLines)"/>
          <path d="M0 405H1180V630H0Z" fill="#cba88b"/><path d="M0 405H1180" stroke="#80594f" stroke-width="9"/><rect y="410" width="1180" height="220" fill="url(#floorWood)"/>
          <path d="M75 343V100Q75 40 138 40Q200 40 200 100V343Z" fill="#815957"/><path d="M88 331V98Q88 51 138 51Q187 51 187 98V331Z" fill="url(#windowSky)"/><path d="M138 52V332 M89 184H186" stroke="#f7efd4" stroke-width="10"/><path d="M105 318q18-58 31-28t29-34t21 8v66z" fill="#77ad8f"/><path d="M104 112q22-18 40-10t37-26" stroke="#fff9df" stroke-width="4" opacity=".5" fill="none"/>
          <path d="M330 0v66" stroke="#74585a" stroke-width="6"/><path d="M291 69Q330 92 369 69L354 121Q330 144 306 121Z" fill="#e2aa76" stroke="#754e4f" stroke-width="6"/><ellipse cx="330" cy="138" rx="83" ry="22" fill="#fce6ab" opacity=".35"/>
          <g stroke="#754e4f" stroke-width="6" stroke-linejoin="round"><path d="M444 89H674V103H444Z" fill="#966f66"/><path d="M468 41h42v47h-42z" fill="#b9b9a0"/><path d="M524 35h36v54h-36z" fill="#e7b09d"/><path d="M574 47h35v41h-35z" fill="#b6d7ca"/><path d="M624 49h30v40h-30z" fill="#d8be8e"/><path d="M453 214H659V230H453Z" fill="#966f66"/><rect x="472" y="170" width="56" height="44" rx="7" fill="#91afb1"/><circle cx="500" cy="188" r="13" fill="#f1d9a9"/><rect x="543" y="162" width="34" height="50" rx="8" fill="#d79891"/><rect x="588" y="172" width="46" height="40" rx="8" fill="#b4a4c9"/></g>
          <g stroke="#665b4c" stroke-width="5" stroke-linecap="round"><path d="M752 0v115"/><path d="M726 117q25 16 52 0l-11 56h-30z" fill="#ffdba1"/><path d="M748 167v45"/><path d="M715 189q33-28 65 0" fill="none"/></g>
          <g stroke="#624f56" stroke-width="5"><rect x="951" y="93" width="165" height="223" rx="8" fill="#dcb48d"/><rect x="963" y="106" width="141" height="198" rx="6" fill="#efe0b6"/><path d="M969 160h131 M970 237h131"/><rect x="985" y="120" width="37" height="38" rx="4" fill="#a7bbad"/><rect x="1031" y="114" width="50" height="47" rx="4" fill="#dfbb94"/><rect x="989" y="189" width="76" height="44" rx="5" fill="#b3a9b6"/><path d="M1070 186v49"/></g>
          <g transform="translate(882 0)" stroke="#577064" stroke-width="4"><path d="M0 0Q25 80 4 140" fill="none"/><path d="M7 23q-48-36-50 1q25 24 50-1 M5 66q44-40 49-6q-16 29-49 6 M5 102q-40-35-38 0q18 25 38 0 M8 122q46-36 42-5q-23 22-42 5" fill="#88b58e"/></g>
          <g stroke="#6d5455" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 483Q180 456 370 483T760 482T1180 476V593Q570 617 0 590Z" fill="#b88677"/><path d="M0 468Q300 439 586 458T1180 466V515Q578 533 0 506Z" fill="#f0cba3"/><path d="M50 509V630 M1110 520v110"/></g>
          <g transform="translate(68 290)" stroke="#6b5052" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="74" width="248" height="98" rx="18" fill="#89a9a0"/><rect x="15" y="85" width="218" height="68" rx="11" fill="#c4d5ba"/><circle cx="70" cy="119" r="27" fill="#f0e0ba"/><circle cx="70" cy="119" r="16" fill="#9aaeb0"/><path d="M145 104h56 M145 119h56 M145 134h56" stroke="#6e8582"/><path d="M24 76v-36q0-12 12-12h88" fill="none" stroke="#9e7f78"/></g>

          <g transform="translate(1020 371)" stroke="#76575c" stroke-width="5" stroke-linejoin="round"><path d="M14 108q-21-55 3-83q16-21 35-5q21-31 45-2q17 28 0 90Z" fill="#b99c86"/><path d="M3 55q-36-27-26-49q23-15 37 22" fill="#b99c86"/><path d="M74 51q25 0 29 27" fill="none"/><circle cx="39" cy="65" r="4" fill="#473b41"/><circle cx="73" cy="65" r="4" fill="#473b41"/><path d="M52 78q6 6 12 0" fill="none"/></g>
          <g transform="translate(358 390)" stroke="#72515b" stroke-width="6" stroke-linejoin="round"><rect x="0" y="0" width="142" height="91" rx="9" fill="#c2aa8b"/><path d="M9 18H134"/><path d="M26 39h88v37H26Z" fill="#f0e2bb"/><circle cx="41" cy="55" r="9" fill="#c8827c"/><circle cx="78" cy="55" r="9" fill="#95b5a1"/><circle cx="110" cy="55" r="9" fill="#d7b06c"/></g>
          <g transform="translate(536 407)" stroke="#765658" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="23" width="167" height="48" rx="15" fill="#c5a49a"/><path d="M36 22V8h99v14" fill="#e5cbb2"/><circle cx="48" cy="47" r="9" fill="#d9b675"/><circle cx="82" cy="47" r="9" fill="#d9b675"/><circle cx="115" cy="47" r="9" fill="#d9b675"/></g>
          <g fill="#fff1b8"><path d="M730 288l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/><path d="M247 150l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/></g>
        </svg>
      </div>
      <div class="shop-overlay">
        <div class="story-card" id="storyCard"></div>
        <div class="shop-bottom"><div class="welcome-note" id="welcomeNote">✿ Every object has a story. Every story deserves a little care.</div><div class="gift-shelf" id="giftShelf"></div></div>
      </div>
    </section>
    <section class="screen bench-screen hidden" id="benchScreen">
      <aside class="case-panel">
        <div class="case-top"><span class="overline" id="caseTag">CASE 01 / INSPECTION</span><h2 id="caseTitle"></h2><p id="caseDescription"></p></div>
        <div class="customer-mini"><div class="portrait small" id="benchPortrait"></div><div><strong id="benchName"></strong><small id="benchQuote"></small></div></div>
        <div class="notebook"><h3>✎ Work notes</h3><div id="clueList" class="clue-list"></div></div>
        <div class="case-bottom"><button id="backShopBtn" class="quiet-btn">‹ Return to shop</button></div>
      </aside>
      <section class="work-panel">

   if(a.gears.every((v,i)=>v===[0,2,1][i])){toast('The tiny gears mesh perfectly.');nextStep()}else{save();renderBench()}return;
 }
 if(t==='circuit'){
   if(!id.startsWith('dial-'))return;const k=Number(id.slice(5));a.circuit[k]=(a.circuit[k]+1)%3;sound();
   if(a.circuit.every((v,i)=>v===[2,0,1,2][i])){toast('Every contact is in its proper place.');nextStep()}else{save();renderBench()}return;
 }
 return originalHandle(id);
};
const originalRenderBench=renderBench;
renderBench=function(){originalRenderBench();const a=active(),j=job(),step=a?.phase==='repair'&&j?shared[j.object][a.step]:null;const isFocus=!!step&&['lift','returnCase','untangle','connect','gearAlign','circuit','tighten'].includes(step.type);$('benchScreen').classList.toggle('puzzle-focus',isFocus);document.body.classList.toggle('repair-immersive',isFocus);if(!step)return;
 if(['lift','returnCase','untangle','connect','gearAlign','circuit','tighten'].includes(step.type)){
   $('repairSvg').setAttribute('viewBox','160 55 560 352');
   const tips={lift:'Drag or tap the cover to move it into the tray',returnCase:'Select or drag the cover back onto the object',untangle:'Swap two loose wire ends to straighten them',connect:'Drag or tap a wire, then tap its matching plug',gearAlign:'Rotate each gear until its dot reaches the notch',circuit:'Match the bottom symbols to the top symbols',tighten:'Secure every screw before testing'};
   $('floatingTip').textContent=tips[step.type];$('floatingTip').classList.add('show');
   const progress=step.type==='connect'?`${a.doneTargets.length} / ${cableColours(step).length} plugs`:step.type==='tighten'?`${a.doneTargets.length} / ${step.targets.length} screws`:'';
   $('toolArea').innerHTML=`<span class="repair-progress">${progress||'✿ Take your time'}</span><button class="tool-chip" data-act="repairHint">Need a hint?</button><button class="tool-chip" data-act="leaveBench">← Shop</button>`;
 }
};
const originalBind=bindSvgEvents;
bindSvgEvents=function(){originalBind();
 const a=active(),j=job();if(!a||a.phase!=='repair'||!j)return;const step=shared[j.object][a.step],type=step?.type;
 if(!['untangle','connect','lift','returnCase'].includes(type))return;
 const svg=$('repairSvg'),sources=type==='connect'?'[data-target^="src-"]':type==='untangle'?'[data-target^="end-"]':'#shellPiece';
 svg.querySelectorAll(sources).forEach(el=>{
   let start=null,moved=false;
   el.addEventListener('pointerdown',e=>{if(e.button!==0)return;start=svgPoint(e);moved=false;try{el.setPointerCapture(e.pointerId)}catch{};e.preventDefault()});
   el.addEventListener('pointermove',e=>{if(!start)return;const p=svgPoint(e);moved=Math.hypot(p.x-start.x,p.y-start.y)>14||moved;
     if(type==='connect'){const preview=svg.querySelector('#wirePreview');if(preview){preview.setAttribute('d',`M${start.x} ${start.y} Q${(start.x+p.x)/2} ${start.y-30} ${p.x} ${p.y}`);preview.setAttribute('stroke',palette[el.dataset.target?.slice(4)]||'#e0b54f')}}
     if((type==='lift'||type==='returnCase')&&moved)el.setAttribute('transform',`translate(${p.x-start.x} ${p.y-start.y})`);
   });
   el.addEventListener('pointerup',e=>{if(!start)return;const p=svgPoint(e),distance=Math.hypot(p.x-start.x,p.y-start.y),id=el.dataset.target;start=null;
     if(distance<14)return;
     e.preventDefault();e.stopPropagation();
     if(type==='lift'){handleTarget('shell');return}
     if(type==='returnCase'){handleTarget('shell');handleTarget('caseSlot');return}
     let closest=null,best=65;
     const targets=type==='connect'?svg.querySelectorAll('[data-target^="sock-"]'):svg.querySelectorAll('[data-target^="end-"]');
     targets.forEach(t=>{if(t===el)return;const cx=Number(t.querySelector('circle')?.getAttribute('cx')),cy=Number(t.querySelector('circle')?.getAttribute('cy'));const dist=Math.hypot(cx-p.x,cy-p.y);if(dist<best){best=dist;closest=t.dataset.target}});
     if(closest){handleTarget(id);handleTarget(closest)}else renderBench();
   });
   el.addEventListener('pointercancel',()=>{start=null;renderBench()});
 });
};
// Capture the new hints and a way to leave the fullscreen workbench.
document.addEventListener('click',e=>{const back=e.target.closest('[data-act="leaveBench"]');if(back){e.stopPropagation();document.body.classList.remove('repair-immersive');$('benchScreen').classList.remove('puzzle-focus');shop();return}const btn=e.target.closest('[data-act="repairHint"]');if(!btn)return;e.stopPropagation();const st=shared[job().object][active().step];const hint={untangle:'Choose two ends on the right: swap them until the coloured cables do not cross.',connect:'Yellow to yellow, teal to teal, pink to pink and purple to purple.',lift:'Tap the big cover or slide it towards the parts tray.',returnCase:'Tap the lid in the parts tray, then tap the dotted outline.',gearAlign:'Each cog has a small gold dot. Turn it until the dot meets the green notch.',circuit:'Top symbols are the target. Tap the dials below until they match.',tighten:'Tap all highlighted screw heads, then you can test the repaired object.'};modal(`<div class="modal-emoji">🫖</div><h2>A little workshop hint</h2><p>${hint[st.type]||'Try looking closely at the object.'}</p><p class="note">No timers, no hurry. Every repair is worth doing slowly.</p><button class="pill-btn" data-act="closeModal">Back to the workbench</button>`);},true);
// A compact top bar keeps the extra fame indicator visible on smaller phones.
const cosyStyle=document.createElement('style');cosyStyle.textContent=`.fame-note{font-size:10px;color:#7d695e;background:#f2e5cb;border-radius:10px;padding:6px 8px;margin-top:8px;border:1px dashed #c7a688}.repair-progress{font-size:11px;color:#6b8272;font-weight:800}.stat#buzzStat{background:#e8efdf}.stat#buzzStat span{color:#98a780}@media(max-width:950px){.stats{gap:4px}.stat{min-width:65px;padding:4px 6px}.stat b{font-size:14px}.stat small{font-size:9px}.topbar{padding-inline:10px;gap:5px}.brand{gap:3px}.brand strong{font-size:17px}.brand small{font-size:9px}.story-card{max-height:calc(100% - 55px)}.work-bottom{padding:7px;min-height:62px}.work-instruction p{font-size:10px}.tool-chip{padding:5px 7px}}@media(max-height:450px){.fame-note{font-size:9px;padding:3px}.story-card{min-height:0}.stat#buzzStat small{display:none}}`;
cosyStyle.textContent+=`.repair-immersive .topbar,.repair-immersive .footer{display:none}.puzzle-focus .case-panel{display:none}.puzzle-focus .work-panel{padding:6px 12px;gap:5px}.puzzle-focus .work-top{flex:0 0 33px;padding:0 10px}.puzzle-focus .work-top h2{font-size:19px}.puzzle-focus .work-top .overline{display:none}.puzzle-focus .work-mat{border-width:5px}.puzzle-focus .work-bottom{min-height:54px;padding:5px 10px;gap:6px}.puzzle-focus .work-instruction strong{font-size:14px}.puzzle-focus .work-instruction p{font-size:11px;margin-top:2px}.puzzle-focus .floating-tip{display:none}.puzzle-focus .tool-area{max-width:60%}`;document.head.append(cosyStyle);

shop();
})();

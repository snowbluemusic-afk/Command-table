lor:#fff0c6;font:700 13px Georgia,serif;text-align:center}.fineprint{font:10px system-ui,sans-serif;opacity:.8;text-align:center}.enchanted{color:#e3cd92;text-shadow:0 0 6px #ffee7688}.counter-caption{position:absolute;bottom:29%;left:50%;transform:translateX(-50%);background:#1c3936dc;border:1px solid #cda36c;color:#fff0cd;border-radius:30px;white-space:nowrap;padding:5px 11px;font:700 10px system-ui,sans-serif}.fade-in{animation:fadein .3s ease both}@keyframes fadein{from{opacity:.3}to{opacity:1}}@media(max-height:680px){.shop-portrait{top:14%;width:min(30vw,160px)}.portrait-plaquette{top:calc(14% + min(30vw,160px) - 14px)}.npc-note{top:15%}.counter-object{bottom:36%;height:26vh}.bottom-sheet{bottom:6px}.sheettext{padding-bottom:5px;font-size:12px}.benchpanel{inset:calc(env(safe-area-inset-top) + 45px) 8px 5px}.object-stage{max-height:33vh;min-height:106px}.puzzlebox{max-height:40vh;min-height:145px;padding:8px}.puzzlebox h3{font-size:17px}.topbar{top:5px}.chapter{top:54px}}@media(min-width:700px){#game{max-width:530px;margin:auto;box-shadow:0 0 0 2px #88633d,0 0 100px #071f1a}.npc-note{max-width:46%}.shop-portrait{top:20%}.portrait-plaquette{top:calc(20% + min(40vw,205px) - 15px)}}

(()=>{'use strict';
const $=s=>document.querySelector(s);const game=$('#game');const RUNE=['✦','✶','☽','✤','❖','♧'];const COLORS=['#ee9e50','#83c7af','#c581b7','#75aee9','#e1c463'];const COLOR_NAMES=['amber','mint','amethyst','sky','gold'];
const CUSTOMERS={lira:{name:'Lira Fernwhistle',role:'Elven cartographer',face:'lira',tag:'Curious • Warm'},oren:{name:'Master Oren',role:'Clockmaker of Bracken',face:'oren',tag:'Proud • Fussy'},pippa:{name:'Pippa Quickpaw',role:'Apprentice inventor',face:'pippa',tag:'Optimistic • Chaotic'},selene:{name:'Selene Moonquill',role:'Moonlight librarian',face:'selene',tag:'Mysterious • Kind'},bram:{name:'Bram Hearth',role:'Town watch captain',face:'bram',tag:'Reserved • Earnest'},nix:{name:'Nix the Azure',role:'Young dragon courier',face:'nix',tag:'Loud • Sweet'},fenn:{name:'Fenn Copperhand',role:'Travelling tinkerer',face:'fenn',tag:'Cheerful • Flirtatious'},moss:{name:'Moss',role:'Forest spirit',face:'moss',tag:'Quiet • Unexpected'}};
const JOBS=[
 {id:'lantern',name:'Wispkeeper Lantern',item:'lantern',who:'lira',issue:'The guide-light has lost its way.',line:'It used to lead me through the fog. Now it insists north is under my bed.',story:'A map of vanished footpaths is tucked into the handle. Lira swears the lantern whispers when the moon is full.',clues:['The glow flickers in a six-pointed rhythm.','All wires are seated; the rune wheel sits one notch off.'],fault:'Misaligned rune lattice',wrong:['Cracked glass chimney','Empty oil reservoir'],puzzles:['rune'],pay:22,gift:'A tiny pressed four-leaf clover'},
 {id:'watch',name:'Grandfather’s Starwatch',item:'watch',who:'oren',issue:'The second hand has stopped.',line:'I have fixed a thousand clocks. This one belongs to my father, so I cannot bear to touch it.',story:'The inside reads: “Make time for the people who make time for you.”',clues:['A fine brass tooth rattles behind the dial.','The mainspring has tension, but a tiny pinion is missing.'],fault:'Missing escapement gear',wrong:['Weak winding spring','Broken watch glass'],puzzles:['gear'],pay:28,gift:'A polished brass cog'},
 {id:'communicator',name:'Whispering Shell',item:'shell',who:'pippa',issue:'Every message sounds like a seagull.',line:'I built it to tell my mum good night. Instead it keeps shouting FISH!',story:'Pippa built the shell from mismatched pieces salvaged from the beach.',clues:['Three silk wires cross beneath the spiral shell.','The connectors are intact, but none reaches the correct crystal.'],fault:'Cross-connected signal wires',wrong:['Bad spell grammar','Soggy microphone'],puzzles:['wire'],pay:25,gift:'A little paper seagull'},
 {id:'music',name:'Moonlight Music Box',item:'music',who:'selene',issue:'Its lullaby has forgotten the ending.',line:'This was my sister’s. Every night the box plays all but the last four notes.',story:'Selene remembers the lullaby exactly. She hums it while you work.',clues:['The brass comb is unbent.','The note drum slips at a particular sequence of four pins.'],fault:'Misordered melody pins',wrong:['Dull acoustic mirror','Loose lid hinge'],puzzles:['rhythm'],pay:32,gift:'A silver bookmark'},
 {id:'fox',name:'Pocket Fox Automaton',item:'fox',who:'nix',issue:'It runs backwards and sneezes sparks.',line:'His name is Sir Sprocket, and he absolutely did NOT eat my homework.',story:'A tiny note inside says “For courage on your first journey.”',clues:['Three replacement parts are laid out beside the chassis.','The tail hinge and balance wheel were fitted in the wrong order.'],fault:'Incorrect chassis assembly',wrong:['Cursed fox spirit','Excessive enthusiasm'],puzzles:['assembly'],pay:34,gift:'A dragon-scale button'},
 {id:'warmer',name:'Alchemist’s Tea Warmer',item:'warmer',who:'moss',issue:'It boils the tea into a tiny thunderstorm.',line:'The raincloud tastes of chamomile. The thunder does not.',story:'The warmer once belonged to the oldest tree in the forest, according to Moss.',clues:['Vapour vents from the left copper tube.','The three pressure valves no longer agree with their gauge markings.'],fault:'Unbalanced pressure valves',wrong:['Cracked teacup','Moon phase interference'],puzzles:['pressure'],pay:38,gift:'A living moss terrarium'},
 {id:'compass',name:'Wayfinder Compass',item:'compass',who:'fenn',issue:'The needle points toward whoever owes me money.',line:'It’s a brilliant feature in theory. A terrible feature when everyone owes me money.',story:'Fenn promises to take you to see the fireflies over Willowmere, if the compass works again.',clues:['A dull film covers the looking crystal.','The needle bearing turns freely after the glass is polished.'],fault:'Clouded crystal lens',wrong:['Polarised fairy dust','Demagnetised needle'],puzzles:['lens'],pay:40,gift:'A firefly charm'},
 {id:'owl',name:'Library Owl Messenger',item:'owl',who:'selene',issue:'Its wing sparks when it tries to fly.',line:'It’s supposed to carry love letters, not set them on fire. Though some deserve it.',story:'The tiny messenger carries an unopened letter addressed to an old rival.',clues:['A bright break interrupts two copper traces.','The mechanical wings still move when turned by hand.'],fault:'Two broken solder joints',wrong:['Worn flight feather','Hollow ink cartridge'],puzzles:['solder'],pay:45,gift:'An origami owl'},
 {id:'crown',name:'The Stolen Sun Circlet',item:'crown',who:'bram',issue:'A ceremonial circlet refuses to glow.',line:'This is an evidence piece. The person who dropped it insists it is a soup bowl.',story:'A serial number inside matches a missing crown reported by the town museum. Captain Bram wants the truth.',clues:['The royal seal is filed away.','A museum inventory mark is hidden beneath the crest.'],fault:'Tampered moonstone socket',wrong:['Ordinary tarnish','Poor candle placement'],puzzles:['rune','solder'],pay:52,stolen:true,gift:'A town-watch commendation'},

const XP_TITLES=['New Arrival','Neighbourhood Fixer','Trusted Tinkerer','Master Mender','Legend of Bracken'];const MAXJ=JOBS.length;const DEFAULT={idx:0,coins:60,renown:0,hearts:{},gifts:[],decor:[],history:[],quality:3,help:false,muted:false};const key='mending-hour-v4';

function load(){try{let a=JSON.parse(localStorage.getItem(key));if(a&&typeof a.idx==='number')return {...DEFAULT,...a};let raw=window.AndroidStore?.load?.()||localStorage.getItem('the-mending-hour-v3')||'null';let v=JSON.parse(raw);if(v&&typeof v==='object')return {...DEFAULT,coins:Number(v.coins)||60,renown:Number(v.reputation)||0,gifts:Array.isArray(v.gifts)?v.gifts.filter(x=>typeof x==='string'):[]};}catch(e){}return {...DEFAULT}}function save(){try{localStorage.setItem(key,JSON.stringify(state));window.AndroidStore?.save?.(JSON.stringify(state));}catch(e){}}function customer(){return CUSTOMERS[job?.who||'lira']}function level(){return Math.min(4,Math.floor(state.renown/20))}function currentJob(){if(state.idx<MAXJ)return JOBS[state.idx];let source=JOBS[(state.idx-MAXJ)%JOBS.length];return {...source,id:source.id+'-'+state.idx,issue:source.issue+' (a new challenge)',pay:source.pay+15+Math.floor(state.idx/4)*4,puzzles:state.idx>17?[source.puzzles[0],['rune','gear','wire','pressure','solder','rhythm','assembly','lens'][state.idx%8]]:source.puzzles}}

if(phase==='fasten')return `<h3>⚒ Secure the casing</h3><p>Refit each fastener to finish reassembly. The repair is not complete until the casing is secured.</p><div class="tip">${screws.length} of ${fastenerCount()} ${fastenerName()} secured.</div>${screws.length===fastenerCount()?`<div class="buttons">${actionButton('Run the final test →','test','','primary')}</div>`:''}`;

else if(type==='fox'||type==='owl'){let fox=type==='fox';content=`<path d="M120 245L142 181L246 180L276 250L242 288L152 288Z" fill="url(#brass)" stroke="#6f4628" stroke-width="10"/>${fox?`<path d="M142 163L112 78L175 114M249 163L289 78L222 114" fill="#c68b4d" stroke="#5c3522" stroke-width="9"/>`:`<path d="M134 177L76 116L109 236M262 177L324 116L292 236" fill="#c69a66" stroke="#5c3522" stroke-width="8"/>`}<circle cx="200" cy="172" r="78" fill="${open?'#26453b':'url(#brass)'}" stroke="#63452d" stroke-width="9"/>${open?`${gear(183,162,33)}${gear(222,185,24)}`:`<circle cx="169" cy="167" r="18" fill="#91ded7"/><circle cx="230" cy="167" r="18" fill="#91ded7"/><circle cx="170" cy="169" r="6" fill="#19454f"/><circle cx="230" cy="169" r="6" fill="#19454f"/><path d="M176 209Q200 232 224 209" fill="none" stroke="#6f4630" stroke-width="7"/>`}<path d="M164 280L149 311M244 279L258 312" stroke="#c28c51" stroke-width="16" stroke-linecap="round"/>`}
else if(type==='warmer'){content=`<path d="M171 70L231 70L240 119Q287 159 270 240Q259 291 197 291Q135 286 127 236Q112 159 160 117Z" fill="${open?'#2c4d43':'url(#brass)'}" stroke="#5c3d27" stroke-width="10"/><ellipse cx="200" cy="212" rx="60" ry="64" fill="${open?'#123d35':'url(#glass)'}" stroke="#e6c27c" stroke-width="8"/>${open?`${gear(204,218,34)}`:`<path d="M165 223Q200 184 240 223" stroke="#efffb9" stroke-width="14" opacity=".6" fill="none"/>`}<path d="M140 129L91 135L91 208M266 127L308 132L308 215" fill="none" stroke="#f1c776" stroke-width="14" stroke-linecap="round"/>${[91,199,308].map((x,i)=>`<circle cx="${x}" cy="${i===1?81:138}" r="20" fill="url(#brass)" stroke="#5c402b" stroke-width="7"/>`).join('')}`}
else if(type==='shell'){content=`<path d="M200 84Q307 92 303 206Q280 296 200 281Q101 277 94 184Q100 101 200 84Z" fill="${open?'#31564c':'url(#glass)'}" stroke="url(#brass)" stroke-width="15"/><path d="M146 151Q236 94 268 178Q287 246 204 250Q143 244 160 180Q170 148 206 156" fill="none" stroke="#f9db9c" stroke-width="16"/><circle cx="205" cy="192" r="18" fill="#84edcc"/>${open?`${gear(201,193,38)}`:''}<path d="M123 238L97 281M272 237L300 283" stroke="#e0b974" stroke-width="13"/>`}
else if(type==='crown'){content=`<path d="M69 165L123 197L158 105L202 178L248 100L278 197L334 162L309 259Q199 290 88 259Z" fill="url(#brass)" stroke="#6b442b" stroke-width="10"/><ellipse cx="201" cy="252" rx="112" ry="28" fill="none" stroke="#fce0a1" stroke-width="9"/><path d="M157 194L201 152L245 194L203 231Z" fill="#7fe0d4" stroke="#fff1b4" stroke-width="7"/>${open?`${gear(200,224,28)}`:''}${[118,286].map(x=>`<circle cx="${x}" cy="227" r="15" fill="#a86ed4" stroke="#ffe4af" stroke-width="7"/>`).join('')}`}
else{content=`<rect x="88" y="85" width="226" height="197" rx="25" fill="url(#brass)" stroke="#563929" stroke-width="10"/><rect x="113" y="116" width="174" height="127" rx="8" fill="${open?'#183a32':'url(#glass)'}" stroke="#efd08f" stroke-width="9"/>${open?gear(204,177,42):`<circle cx="201" cy="174" r="45" fill="#8fe0c8"/>`}`}
return `<svg viewBox="0 0 400 350" aria-label="${type} ${open?'opened':'sealed'}" class="object-svg ${open?'dismantled':''}" xmlns="http://www.w3.org/2000/svg">${filter}<ellipse cx="200" cy="322" rx="128" ry="18" fill="#091b16" opacity=".35"/>${content}</svg>`}
function start(){view='bench';phase='inspect';job=currentJob();inspectMarks=[];screws=[];parts=[];pIndex=0;ps={};coverFitted=false;repairQuality=3;selected=null;selectedWire=null;diagAnswer=false;stolenDecision=null;render()}
function setPhase(next){phase=next;selected=null;selectedWire=null;render()}
function initializePuzzle(type){let difficulty=Math.min(3,1+Math.floor(state.idx/5));if(type==='rune')ps[type]={target:[2,4,1].map((x,i)=>(x+state.idx+i)%RUNE.length),val:[0,0,0]};if(type==='wire'){let n=3+(difficulty>=2?1:0);ps[type]={colors:Array.from({length:n},(_,i)=>i),socketOrder:Array.from({length:n},(_,i)=>(i+2)%n),done:[],knots:difficulty+1}}if(type==='gear')ps[type]={order:['Pinion','Crown','Escape'],options:['Crown','Escape','Pinion','Old cog'],slots:Array(3).fill(''),wound:0};if(type==='rhythm')ps[type]={sequence:[0,2,1,3,0,1].slice(0,3+difficulty),index:0};if(type==='assembly')ps[type]={order:['Spring','Heart','Tail'],options:['Heart','Bent pin','Tail','Spring','Loose nail'],slots:{}};if(type==='pressure')ps[type]={target:[2,1,3],val:[0,0,0]};if(type==='solder')ps[type]={pairs:2+(difficulty>=3?1:0),done:[]};if(type==='lens')ps[type]={clean:[],angle:0,target:3+Math.min(2,difficulty)};}
function beginPuzzle(){phase='puzzle';pIndex=0;for(let type of job.puzzles)initializePuzzle(type);selected=null;selectedWire=null;render()}
function advancePuzzle(){if(pIndex<job.puzzles.length-1){pIndex++;selected=null;selectedWire=null;notice('✦ One fault fixed! Another mechanism needs work.');render()}else{phase='refit';coverFitted=false;notice('✧ All faults repaired. Reassemble the casing.');render()}}
function minus(msg){repairQuality=Math.max(1,repairQuality-1);notice(msg,true);render()}
function notice(msg,warn=false){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast '+(warn?'warn':'');n.textContent=msg;game.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),1600)}
function beep(f=430){if(state.muted)return;try{const A=window.AudioContext||window.webkitAudioContext;const cx=window.__sound||(window.__sound=new A());const o=cx.createOscillator();const g=cx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.036,cx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,cx.currentTime+.19);o.connect(g);g.connect(cx.destination);o.start();o.stop(cx.currentTime+.2);}catch(e){}}
function relationship(who,amt){state.hearts[who]=(state.hearts[who]||0)+amt}
function completed(price){const fair=price==='fair',free=price==='gift',premium=price==='premium';let coins=free?0:Math.round(job.pay*(premium?1.7:1));let fame=(free?8:fair?5:premium?-1:0)+(repairQuality-2)*2;if(stolenDecision==='report')fame+=5;state.coins+=coins;state.renown=Math.max(0,state.renown+fame);relationship(job.who,free?2:fair?1:0);if(!state.gifts.includes(job.gift)&&(!premium||repairQuality===3))state.gifts.push(job.gift);state.history.unshift({name:job.name,who:CUSTOMERS[job.who].name,fee:coins,quality:repairQuality,fame:fame});state.history=state.history.slice(0,30);state.idx++;save();view='shop';dialogExtra=false;modal={title:'Another story restored',body:`<p>✦ <b>${job.name}</b> is back in working order.</p><p>Earned <b>${coins} coins</b> · Word of mouth <b>${fame>=0?'+':''}${fame}</b> · ${repairQuality} quality stars.</p><p>${state.gifts.includes(job.gift)?'A little keepsake joins your collection: <b>'+job.gift+'</b>.':''}</p>${state.idx===3?'<p>✨ The neighbours have started recommending your shop. New tools and decorations are available.</p>':''}`,actions:[['Meet the next customer','closemodal']]};render()}
function doAction(a,v){if(modal&&a!=='closemodal'&&!['buy','journal','upgrades','close-and-shop','mute'].includes(a))return;
if(a==='story'){dialogExtra=!dialogExtra;render();return}if(a==='begin'){start();return}if(a==='return-shop'){if(phase!=='inspect'&&phase!=='invoice'){modal={title:'Leave the workbench?',body:'<p>Your current repair will restart from inspection if you leave. Completed jobs and coins stay saved.</p>',actions:[['Keep repairing','closemodal'],['Return to shop','close-and-shop']]};render()}else{view='shop';render()}return}
if(a==='inspect'){let i=Number(v);if(!inspectMarks.includes(i)){inspectMarks.push(i);beep(400+i*95)}render();return}if(a==='diagnose'){if(v===job.fault){diagAnswer=true;setPhase('unfasten');notice('✓ Fault identified! Open the casing.')}else minus('Not quite. Study the clues and try again.');return}
if(a==='screw'){const i=Number(v);if(!screws.includes(i)){screws.push(i);beep(350+i*20)}if(phase==='fasten'&&screws.length===fastenerCount())notice('All screws secured.');render();return}
if(a==='uncover'){if(phase==='unfasten'&&screws.length<fastenerCount())return;beginPuzzle();return}
if(a==='fitcover'){coverFitted=true;screws=[];setPhase('fasten');return}
if(a==='test'){if(screws.length!==fastenerCount())return;ps.testProgress=0;setPhase('test');return}
if(a==='testgo'){ps.testProgress=100;beep(660);setPhase('invoice');return}if(a==='charge'){completed(v);return}
if(phase==='puzzle'){let t=job.puzzles[pIndex],p=ps[t];
if(a==='rune'&&t==='rune'){p.val[+v]=(p.val[+v]+1)%RUNE.length;beep(340);if(p.val.every((x,i)=>x===p.target[i]))advancePuzzle();else render();return}
if(a==='knot'&&t==='wire'){p.knots=Math.max(0,p.knots-1);beep(380);render();return}
if(a==='wirefrom'&&t==='wire'){if(p.knots){notice('Untangle the crossing loops first.');return}if(!p.done.includes(+v)){selectedWire=+v;beep(355);render()}return}
if(a==='wireto'&&t==='wire'){if(selectedWire===null){notice('Select a loose cable on the left.');return}if(selectedWire===+v){p.done.push(+v);selectedWire=null;beep(600);if(p.done.length===p.colors.length)advancePuzzle();else render()}else{selectedWire=null;minus('Wrong port—the crystal flickers. Match the colours.')}return}
if(a==='gearpart'&&t==='gear'){selected=+v;beep(360);render();return}
if(a==='gearslot'&&t==='gear'){if(selected===null)return;let candidate=p.options[selected],slot=+v;if(candidate===p.order[slot]&&!p.slots[slot]){p.slots[slot]=candidate;selected=null;beep(550);render()}else{selected=null;minus('That gear does not mesh with this cradle.')}return}
if(a==='wind'&&t==='gear'){p.wound++;beep(430+p.wound*55);if(p.wound>=3)advancePuzzle();else render();return}
if(a==='bell'&&t==='rhythm'){const n=+v;beep([392,440,523,588][n]);if(n===p.sequence[p.index]){p.index++;if(p.index===p.sequence.length)advancePuzzle();else render()}else{p.index=0;minus('A wrong note. The musical strip is still here to guide you.')}return}
if(a==='assemblypart'&&t==='assembly'){selected=v;beep(370);render();return}
if(a==='assemblyslot'&&t==='assembly'){if(!selected)return;const i=+v;if(selected===p.order[i]){p.slots[i]=selected;selected=null;beep(590);if(Object.keys(p.slots).length===p.order.length)advancePuzzle();else render()}else{selected=null;minus('That part will not fit this socket.')}return}
if(a==='valve'&&t==='pressure'){p.val[+v]=(p.val[+v]+1)%4;beep(300);if(p.val.every((n,i)=>n===p.target[i]))advancePuzzle();else render();return}
if(a==='solder'&&t==='solder'){let i=parseInt(v,10),side=v.slice(-1);if(p.done.includes(i))return;if(selectedWire===null){selectedWire=v;beep(280);render()}else{let j=parseInt(selectedWire,10),side2=selectedWire.slice(-1);if(j===i&&side!==side2){p.done.push(i);selectedWire=null;beep(560);if(p.done.length===p.pairs)advancePuzzle();else render()}else{selectedWire=null;minus('The copper traces do not form that circuit.')}}return}
if(a==='polish'&&t==='lens'){if(!p.clean.includes(+v)){p.clean.push(+v);beep(460)}render();return}
if(a==='calibrate'&&t==='lens'){p.angle=(p.angle+1)%8;beep(470);if(p.clean.length===4&&p.angle===p.target)advancePuzzle();else render();return}
}
if(a==='suspect'){modal={title:'A question of ownership',body:'<p>The mark beneath the circlet matches a missing exhibit. Captain Bram is already looking for it.</p><p>What should you do?</p>',actions:[['Report it to the watch','report'],['Ask for proof first','proof'],['Repair it anyway','repair-stolen'],['Not now','closemodal']]};render();return}
if(a==='report'){state.renown+=8;state.coins+=6;state.history.unshift({name:job.name,who:'Town watch',fee:6,quality:3,fame:8});state.idx++;relationship('bram',3);save();modal={title:'Doing the right thing',body:'<p>The circlet is returned to the museum. Captain Bram quietly puts six coins on the counter.</p><p><b>+8 word of mouth</b>. Your shop is known for integrity.</p>',actions:[['Next customer','closemodal']]};view='shop';render();return}
if(a==='proof'){modal={title:'A closer look',body:'<p>Captain Bram produces the museum’s inventory ledger. The numbers match. He thanks you for asking.</p>',actions:[['Report the item','report'],['Repair under supervision','repair-stolen']]};render();return}
if(a==='repair-stolen'){modal=null;stolenDecision='supervised';start();notice('Repair authorised under supervision.');return}
if(a==='journal'){modal={title:'The repair journal',body:`<p><b>${title()}</b> · Day ${state.idx+1} · Renown ${state.renown} · Coins ${state.coins}</p><div class="divider"></div><p><b>Gifts & keepsakes:</b> ${state.gifts.length?state.gifts.map(x=>'✦ '+x).join(' · '):'Your shelves await their first story.'}</p><p><b>Completed repairs:</b></p>${state.history.length?state.history.slice(0,10).map(x=>`<div class="journal-entry"><b>${x.name}</b><br>${x.who} · ${x.fee} coins · ${x.quality}★</div>`).join(''):'<p>No repairs yet.</p>'}`,actions:[['Close journal','closemodal']]};render();return}
if(a==='upgrades'){modal={title:'Improve the workshop',body:`<p>Your reputation is <b>${state.renown}</b>. Every upgrade changes the neighbourhood’s opinion of your shop.</p>${[['Lamp garlands',30,0],['Precision toolkit',75,12],['Flowering window',125,23],['Grand workbench',230,42]].map(([name,cost,req])=>`<div class="journal-entry"><b>${name}</b><br>${cost} coins · ${state.renown<req?'Requires '+req+' renown':state.decor.includes(name)?'Already owned':'Available'}${state.renown>=req&&!state.decor.includes(name)?`<button class="btn" style="margin-top:5px;width:100%" data-a="buy" data-v="${name}">Buy ${name}</button>`:''}</div>`).join('')}`,actions:[['Back to shop','closemodal']]};render();return}
if(a==='buy'){let opts={'Lamp garlands':30,'Precision toolkit':75,'Flowering window':125,'Grand workbench':230};if(state.coins>=opts[v]&&!state.decor.includes(v)){state.coins-=opts[v];state.decor.push(v);save();beep(620);notice(v+' added to your shop!')}else notice('Not enough coins for this upgrade.');doAction('upgrades');return}
if(a==='help'){modal={title:'An apprentice’s notes',body:'<p><b>Repair loop:</b> Inspect clues → diagnose → remove each screw → expose the mechanism → solve the unique fault → put the lid back → secure screws → test → choose a fee.</p><p><b>Wires:</b> Untangle crossed loops, then tap a loose left wire and a matching colour socket.</p><p><b>Gears and parts:</b> Tap the replacement piece, then tap the correct slot. Wrong parts lower your quality.</p><p><b>Rhythm and runes:</b> There is no clock. Use the diagram or musical strip as many times as you like.</p><p>Your character stories, keepsakes and money are saved offline.</p>',actions:[[state.muted?'Enable sound':'Mute sounds','mute'],['Close','closemodal']]};render();return}
if(a==='mute'){state.muted=!state.muted;save();doAction('help');return}
if(a==='close-and-shop'){modal=null;view='shop';render();return}if(a==='closemodal'){modal=null;render();return}
}
function modalHTML(){return `<div class="modalshade"><div class="modal"><h2>✦ ${modal.title}</h2>${modal.body}${modal.actions.map(([label,a])=>actionButton(label,a,'',a==='closemodal'?'':'primary')).join('')}</div></div>`}
function setupBenchListeners(){ /* All gameplay controls use delegated touch-safe pointer/click handlers. */ }
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v||'';doAction(a,v)});
window.addEventListener('error',e=>{try{console.warn('Mending Hour error',e.message)}catch(_){} });
render();
})();
</script></body></html>
